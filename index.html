<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Интерактивный курс по основам веба для начинающего AppSec-инженера: интернет, HTTP, браузер, состояние, архитектура и модель безопасности браузера.">
<title>Web Security Fundamentals :: AppSec Lab</title>
<style>
:root{
  --bg:#0a0e14;--bg2:#0d131c;--panel:#0f1620;--panel2:#0c111a;
  --cyan:#38bdf8;--cyan-dim:#0ea5c4;--green:#00e676;--amber:#ffb020;--red:#ff5370;--purple:#c792ea;--blue:#5c9eff;--pink:#ff6ac1;
  --txt:#cdd9e5;--txt-dim:#7d8ea3;--txt-faint:#4a5a6e;
  --border:rgba(56,189,248,.15);--border-b:rgba(56,189,248,.4);
  --glow:0 0 14px rgba(56,189,248,.35);
  --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:linear-gradient(rgba(56,189,248,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.03) 1px,transparent 1px);
  background-size:34px 34px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px);opacity:.35;mix-blend-mode:multiply}
::selection{background:var(--cyan);color:#04121b}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--cyan-dim)}

/* ===== BOOT ===== */
#boot{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;cursor:pointer}
#boot .bootbox{width:min(600px,92vw)}
#boot .line{opacity:0;animation:bootln .18s forwards}
#boot .ok{color:var(--green)}#boot .cy{color:var(--cyan)}#boot .am{color:var(--amber)}#boot .dim{color:var(--txt-faint)}
@keyframes bootln{to{opacity:1}}
.enter-hint{margin-top:22px;color:var(--txt-faint);font-size:12px;opacity:0;animation:bootln .3s forwards;animation-delay:3.6s}
.enter-hint .k{color:var(--cyan);border:1px solid var(--border-b);border-radius:4px;padding:1px 7px}

/* ===== LAYOUT ===== */
#app{display:none;min-height:100vh}
.shell{display:flex;max-width:1240px;margin:0 auto;min-height:100vh}
aside{width:264px;flex-shrink:0;border-right:1px solid var(--border);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 18px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand .logo{font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:.5px;text-shadow:var(--glow)}
.brand .tag{font-size:10px;color:var(--txt-faint);letter-spacing:1.5px;margin-top:3px;text-transform:uppercase}
.progress-wrap{padding:0 18px;margin-bottom:14px}
.progress-bar{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:width .5s}
.progress-txt{font-size:10px;color:var(--txt-faint);margin-top:5px}
.navsec{font-size:10px;color:var(--cyan-dim);letter-spacing:2px;padding:12px 18px 5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 18px;cursor:pointer;font-size:12.5px;color:var(--txt-dim);border-left:2px solid transparent;transition:.14s}
.nav-item:hover{color:var(--txt);background:rgba(56,189,248,.05)}
.nav-item.active{color:var(--cyan);border-left-color:var(--cyan);background:rgba(56,189,248,.08)}
.nav-item .ico{width:18px;text-align:center;font-size:13px;flex-shrink:0}
.nav-item .chk{margin-left:auto;font-size:10px;color:var(--green);opacity:0;flex-shrink:0}
.nav-item.done .chk{opacity:1}
.nav-item:focus-visible,.btn:focus-visible,.qopt:focus-visible,.ref:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

main{flex:1;padding:34px 40px;max-width:880px;min-width:0}
.burger{display:none;position:fixed;top:14px;left:14px;z-index:50;background:var(--panel);border:1px solid var(--border-b);color:var(--cyan);width:40px;height:40px;border-radius:8px;font-size:18px;cursor:pointer}

/* ===== CONTENT ===== */
.view{display:none;animation:fade .3s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--cyan-dim);text-transform:uppercase;margin-bottom:11px}
.vtitle{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.12;margin-bottom:12px}
.vtitle .accent{color:var(--cyan);text-shadow:var(--glow)}
.vlede{font-size:14px;color:var(--txt-dim);line-height:1.7;margin-bottom:20px}
.sect{font-size:12px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;margin:32px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sect::before{content:"\25B8";color:var(--cyan)}
.tx{color:var(--txt-dim);margin-bottom:14px;line-height:1.75}
.tx code,code.ic{font-size:12px;background:rgba(56,189,248,.1);color:var(--cyan);padding:1px 6px;border-radius:4px;word-break:break-word}
.hl{color:var(--txt);font-weight:600}
.cy{color:var(--cyan)}.gs{color:var(--green)}.am{color:var(--amber)}.rd{color:var(--red)}.pu{color:var(--purple)}.pk{color:var(--pink)}.bl{color:var(--blue)}.dm{color:var(--txt-faint)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:15px 17px;margin:13px 0}
.card-t{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:7px}
.card.acc-c{border-left:3px solid var(--cyan)}.card.acc-g{border-left:3px solid var(--green)}
.card.acc-a{border-left:3px solid var(--amber)}.card.acc-r{border-left:3px solid var(--red)}
.card.acc-p{border-left:3px solid var(--purple)}.card.acc-b{border-left:3px solid var(--blue)}
.card .tx:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:680px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

.code{background:#05090f;border:1px solid var(--border);border-radius:8px;padding:13px 15px;font-size:12.5px;line-height:1.7;overflow-x:auto;margin:14px 0;position:relative;white-space:pre-wrap;word-break:break-word}
.code-label{position:absolute;top:0;right:0;font-size:9px;color:var(--txt-faint);background:var(--bg2);padding:2px 8px;border-bottom-left-radius:6px;letter-spacing:1px}
.code .kw{color:var(--pink)}.code .op{color:var(--amber)}.code .st{color:var(--green)}.code .cmt{color:var(--txt-faint)}.code .fn{color:var(--cyan)}.code .nm{color:var(--purple)}

.lab{background:linear-gradient(180deg,rgba(56,189,248,.05),transparent);border:1px solid var(--border-b);border-radius:11px;overflow:hidden;margin:18px 0}
.lab-head{background:rgba(56,189,248,.08);padding:9px 15px;font-size:11px;color:var(--cyan);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.4}}
.lab-body{padding:16px}

.btn{background:transparent;border:1px solid var(--border-b);color:var(--cyan);font-family:var(--mono);font-size:12px;padding:8px 15px;cursor:pointer;letter-spacing:.4px;border-radius:6px;transition:.15s}
.btn:hover{background:var(--cyan);color:#04121b;box-shadow:var(--glow)}
.btn.sm{padding:5px 11px;font-size:11px}
.btn.gh{border-color:rgba(125,142,163,.4);color:var(--txt-dim)}
.btn.gh:hover{background:var(--txt-dim);color:#04121b;box-shadow:none}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn[disabled]:hover{background:transparent;color:var(--cyan);box-shadow:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.t{width:100%;border-collapse:collapse;margin:13px 0;font-size:12.5px}
.t th{text-align:left;padding:8px 11px;background:var(--bg2);color:var(--cyan-dim);border:1px solid var(--border);font-weight:600}
.t td{padding:8px 11px;border:1px solid var(--border);color:var(--txt-dim);vertical-align:top}
.twrap{overflow-x:auto;margin:13px 0}
.twrap .t{margin:0;min-width:520px}

.ref{display:block;background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:0 7px 7px 0;padding:10px 14px;margin:8px 0;text-decoration:none;transition:.15s}
.ref:hover{background:rgba(56,189,248,.06);border-left-color:var(--green)}
.ref .r-t{font-size:13px;color:var(--cyan);font-weight:600;display:block}
.ref .r-d{font-size:11px;color:var(--txt-faint);margin-top:2px;display:block}
.ref .r-u{font-size:10px;color:var(--txt-faint);margin-top:3px;word-break:break-all;display:block}
.ref.rfc{border-left-color:var(--purple)}.ref.rfc .r-t{color:var(--purple)}
.ref.owasp{border-left-color:var(--red)}.ref.owasp .r-t{color:var(--red)}
.ref.ps{border-left-color:var(--amber)}.ref.ps .r-t{color:var(--amber)}

.roadmap{display:flex;flex-direction:column;gap:3px;margin:16px 0}
.rm-stage{border:1px solid var(--border);border-radius:9px;padding:13px 15px;background:var(--panel);position:relative;transition:.2s;margin-top:9px}
.rm-stage:hover{border-color:var(--border-b)}
.rm-num{position:absolute;top:-8px;left:14px;font-size:9px;background:var(--bg);color:var(--cyan);padding:1px 8px;border:1px solid var(--border-b);border-radius:8px;letter-spacing:1px}
.rm-t{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:5px}
.rm-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:9px;margin-left:7px;background:rgba(56,189,248,.12);color:var(--cyan)}
.rm-tag.now{background:rgba(0,230,118,.14);color:var(--green)}
.rm-tag.next{background:rgba(255,176,32,.14);color:var(--amber)}
.rm-d{font-size:12px;color:var(--txt-dim)}

.hero-ascii{font-size:clamp(9px,1.6vw,12.5px);line-height:1.75;color:var(--cyan);white-space:pre;overflow-x:auto;margin-bottom:18px;padding:12px 16px;background:#05090f;border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:0 9px 9px 0}
.hero-ascii .gs{color:var(--green)}.hero-ascii .am{color:var(--amber)}.hero-ascii .dm{color:var(--txt-faint)}

/* ===== SCHEMES / SVG ===== */
.svgbox{background:#05090f;border:1px solid var(--border);border-radius:9px;padding:14px;margin:14px 0;overflow-x:auto}
.svgbox svg{display:block;margin:0 auto;max-width:100%;height:auto}
.svgcap{font-size:11px;color:var(--txt-faint);text-align:center;margin-top:9px;line-height:1.5}
.svgbox text{font-family:var(--mono)}
.ascii{background:#05090f;border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin:14px 0;overflow-x:auto;
  font-size:clamp(9px,2.1vw,12px);line-height:1.45;white-space:pre;color:var(--txt-dim)}
.ascii .h{color:var(--cyan)}.ascii .g{color:var(--green)}.ascii .a{color:var(--amber)}.ascii .r{color:var(--red)}.ascii .p{color:var(--purple)}.ascii .f{color:var(--txt-faint)}

/* ===== KEY-VALUE ===== */
.kv{margin:13px 0;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.kv-row{display:grid;grid-template-columns:190px 1fr;gap:0;border-bottom:1px solid var(--border)}
.kv-row:last-child{border-bottom:none}
.kv-k{padding:9px 13px;background:var(--panel2);color:var(--cyan);font-size:12px;border-right:1px solid var(--border);word-break:break-word}
.kv-v{padding:9px 13px;color:var(--txt-dim);font-size:12.5px}
@media(max-width:600px){.kv-row{grid-template-columns:1fr}.kv-k{border-right:none;border-bottom:1px solid var(--border)}}

/* ===== SEC BOX ===== */
.sec-box{background:linear-gradient(180deg,rgba(255,83,112,.07),transparent);border:1px solid rgba(255,83,112,.28);border-left:3px solid var(--red);border-radius:0 9px 9px 0;padding:13px 16px;margin:14px 0}
.sec-box .sb-t{font-size:11px;letter-spacing:1.6px;color:var(--red);text-transform:uppercase;margin-bottom:6px}
.sec-box .tx{margin-bottom:0}
.ask-box{background:linear-gradient(180deg,rgba(199,146,234,.07),transparent);border:1px solid rgba(199,146,234,.28);border-left:3px solid var(--purple);border-radius:0 9px 9px 0;padding:13px 16px;margin:14px 0}
.ask-box .sb-t{font-size:11px;letter-spacing:1.6px;color:var(--purple);text-transform:uppercase;margin-bottom:6px}
.ask-box .q{color:var(--txt);font-size:13px;margin-bottom:5px}
.ask-box .a{color:var(--txt-dim);font-size:12.5px;line-height:1.7}
.ask-box .q+.a{margin-bottom:11px}
.ask-box .a:last-child{margin-bottom:0}

/* ===== CHIPS ===== */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:10.5px;padding:3px 9px;border-radius:11px;background:rgba(56,189,248,.1);color:var(--cyan);border:1px solid var(--border)}
.chip.g{background:rgba(0,230,118,.1);color:var(--green);border-color:rgba(0,230,118,.25)}
.chip.a{background:rgba(255,176,32,.1);color:var(--amber);border-color:rgba(255,176,32,.25)}
.chip.r{background:rgba(255,83,112,.1);color:var(--red);border-color:rgba(255,83,112,.25)}
.chip.f{background:rgba(125,142,163,.1);color:var(--txt-faint);border-color:rgba(125,142,163,.2)}

/* ===== QUIZ ===== */
.quiz{border:1px solid rgba(199,146,234,.35);border-radius:11px;overflow:hidden;margin:22px 0;background:linear-gradient(180deg,rgba(199,146,234,.05),transparent)}
.quiz-head{background:rgba(199,146,234,.1);padding:9px 15px;font-size:11px;color:var(--purple);letter-spacing:1.2px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.quiz-head .qcount{margin-left:auto;color:var(--txt-faint);font-size:10px}
.quiz-head .qbest{font-size:10px;color:var(--green);border:1px solid rgba(0,230,118,.35);border-radius:9px;padding:1px 8px;letter-spacing:.5px}
.quiz-body{padding:16px}
.qq{font-size:13.5px;color:var(--txt);margin-bottom:12px;line-height:1.6}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopt{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:10px 13px;cursor:pointer;
  color:var(--txt-dim);font-family:var(--mono);font-size:12.5px;line-height:1.55;transition:.14s;display:flex;gap:9px;align-items:flex-start}
.qopt:hover:not(.locked){border-color:var(--border-b);color:var(--txt)}
.qopt .mk{color:var(--txt-faint);flex-shrink:0}
.qopt.right{border-color:rgba(0,230,118,.55);background:rgba(0,230,118,.08);color:var(--txt)}
.qopt.right .mk{color:var(--green)}
.qopt.wrong{border-color:rgba(255,83,112,.55);background:rgba(255,83,112,.08);color:var(--txt)}
.qopt.wrong .mk{color:var(--red)}
.qopt.locked{cursor:default}
.qexp{margin-top:12px;padding:11px 13px;border-radius:7px;background:var(--panel2);border-left:3px solid var(--purple);font-size:12.5px;color:var(--txt-dim);line-height:1.7}
.qexp b{color:var(--txt)}
.qnav{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.qdots{display:flex;gap:5px;margin-left:auto}
.qdot{width:8px;height:8px;border-radius:50%;background:var(--bg2);border:1px solid var(--border)}
.qdot.ok{background:var(--green);border-color:var(--green)}
.qdot.no{background:var(--red);border-color:var(--red)}
.qdot.cur{box-shadow:0 0 0 2px rgba(56,189,248,.4)}
.qscore{text-align:center;padding:14px}
.qscore .big{font-size:32px;font-weight:700;color:var(--cyan);text-shadow:var(--glow)}
.qscore .lb{font-size:12px;color:var(--txt-dim);margin-top:6px;line-height:1.7}

/* ===== FLASHCARDS ===== */
.fc-wrap{margin:16px 0}
.fc-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fc-filters .chip{cursor:pointer;user-select:none}
.fc-filters .chip.on{background:var(--cyan);color:#04121b;border-color:var(--cyan)}
.fc{border:1px solid var(--border-b);border-radius:12px;background:var(--panel);min-height:210px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;text-align:center;cursor:pointer;position:relative;transition:.18s}
.fc:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(56,189,248,.12)}
.fc .fc-side{font-size:9px;letter-spacing:2px;color:var(--txt-faint);position:absolute;top:11px;left:15px;text-transform:uppercase}
.fc .fc-tag{font-size:9px;letter-spacing:1.4px;color:var(--cyan-dim);position:absolute;top:11px;right:15px;text-transform:uppercase}
.fc .fc-q{font-size:17px;color:var(--txt);line-height:1.5;font-weight:600}
.fc .fc-a{font-size:13px;color:var(--txt-dim);line-height:1.75;text-align:left;width:100%}
.fc .fc-hint{font-size:10.5px;color:var(--txt-faint);margin-top:16px}
.fc-bar{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.fc-bar .cnt{margin-left:auto;font-size:11px;color:var(--txt-faint)}

/* ===== SEARCH ===== */
#searchOverlay{position:fixed;inset:0;background:rgba(4,8,14,.86);z-index:200;display:none;padding-top:12vh;backdrop-filter:blur(3px)}
#searchOverlay.on{display:block}
.sbox{width:min(620px,92vw);margin:0 auto;background:var(--panel);border:1px solid var(--border-b);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sbox input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--txt);
  font-family:var(--mono);font-size:15px;padding:15px 18px;outline:none}
.sres{max-height:52vh;overflow-y:auto}
.sres-item{padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;color:var(--txt-dim)}
.sres-item:hover,.sres-item.sel{background:rgba(56,189,248,.09);color:var(--cyan)}
.sres-item .sm{font-size:10px;color:var(--txt-faint);display:block;margin-top:2px}
.sres-empty{padding:18px;color:var(--txt-faint);font-size:12px;text-align:center}
.shint{padding:8px 18px;font-size:10px;color:var(--txt-faint);border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap}

@media(max-width:900px){
  aside{position:fixed;left:-274px;top:0;z-index:40;background:var(--bg);transition:left .25s;box-shadow:6px 0 24px rgba(0,0,0,.5)}
  aside.open{left:0}
  .burger{display:block}
  main{padding:64px 18px 40px}
  .kv-row{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ===== BOOT ===== -->
<div id="boot" onclick="enterApp()">
  <div class="bootbox" id="bootbox"></div>
  <div class="enter-hint">нажми <span class="k">ENTER</span> или тапни</div>
</div>

<!-- ===== SEARCH ===== -->
<div id="searchOverlay" onclick="if(event.target===this)closeSearch()">
  <div class="sbox">
    <input id="searchInput" type="text" placeholder="поиск по курсу..." autocomplete="off" aria-label="Поиск по курсу">
    <div class="sres" id="searchRes"></div>
    <div class="shint"><span><span class="cy">↑↓</span> навигация</span><span><span class="cy">Enter</span> открыть</span><span><span class="cy">Esc</span> закрыть</span></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <button class="burger" onclick="document.querySelector('aside').classList.toggle('open')" aria-label="Меню">☰</button>
  <div class="shell">
    <aside id="sidebar"></aside>
    <main id="mainViews"></main>
  </div>
</div>

<script>
/* ===== BOOT SEQUENCE ===== */
const BOOT=[
  {t:'[    0.000000] AppSec Lab :: Web Security Fundamentals',c:'cy'},
  {t:'[    0.000412] initializing learning kernel v2.0 ...',c:'dim'},

/* ===== STORAGE (namespaced + migration) ===== */
const LS={p:'wsl.progress',q:'wsl.quiz'};
function lsRead(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsWrite(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
function lsMigrate(){
  try{
    if(localStorage.getItem(LS.p)===null){
      const old=localStorage.getItem('websec_progress');
      if(old!==null){localStorage.setItem(LS.p,old);localStorage.removeItem('websec_progress');}
    }
    if(localStorage.getItem(LS.q)===null){
      const oldq=localStorage.getItem('websec_quiz');
      if(oldq!==null){
        const o=JSON.parse(oldq)||{},n={};
        Object.keys(o).forEach(function(k){n[k]={i:0,ans:[],done:false,best:o[k].r};});
        localStorage.setItem(LS.q,JSON.stringify(n));localStorage.removeItem('websec_quiz');
      }
    }
  }catch(e){}
}

function getDone(){const v=lsRead(LS.p,[]);return Array.isArray(v)?v:[];}
function markDone(id){const d=getDone();if(d.indexOf(id)<0){d.push(id);lsWrite(LS.p,d);}refreshProgress();buildNav();renderProgressPanel();}

/* ===== QUIZ ENGINE ===== */
let QSTATE=null;
function loadQuizState(){
  const raw=lsRead(LS.q,{})||{},out={};
  Object.keys(QUIZZES).forEach(function(k){
    const s=(raw&&typeof raw==='object'&&raw[k])?raw[k]:{};
    const n=QUIZZES[k].q.length;
    let ans=Array.isArray(s.ans)?s.ans.slice(0,n):[];
    ans=ans.map(function(a){return (typeof a==='number'&&a>=0&&a<9)?a:null;});
    let i=Number(s.i);if(!(i>=0&&i<n))i=0;
    let best=(typeof s.best==='number'&&s.best>=0&&s.best<=n)?s.best:undefined;
    out[k]={i:i,ans:ans,done:!!s.done,best:best};
  });
  return out;
}
function ensureQState(){if(!QSTATE)QSTATE=loadQuizState();return QSTATE;}
function saveQuizState(){lsWrite(LS.q,ensureQState());}

function buildAllQuizzes(){ensureQState();Object.keys(QUIZZES).forEach(k=>buildQuiz(k));}
function buildQuiz(key){
  const host=document.getElementById('quiz-'+key);if(!host)return;
  ensureQState();
  if(!QSTATE[key])QSTATE[key]={i:0,ans:[],done:false};
  renderQuiz(key);
}
function renderQuiz(key){
  const host=document.getElementById('quiz-'+key);if(!host)return;
  ensureQState();
  const Q=QUIZZES[key],st=QSTATE[key];if(!Q||!st)return;
  const dots=Q.q.map((_,i)=>{
    let c='qdot';const a=st.ans[i];
    if(a!==undefined&&a!==null)c+=(a===Q.q[i].c?' ok':' no');
    if(i===st.i&&!st.done)c+=' cur';
    return '<span class="'+c+'"></span>';
  }).join('');
  let body;
  if(st.done){
    const right=st.ans.filter((a,i)=>a===Q.q[i].c).length;
    const pct=Math.round(right/Q.q.length*100);
    let verdict;
    if(pct===100)verdict='Идеально. Секция закрыта — иди дальше.';
    else if(pct>=70)verdict='Хорошо. Вернись к вопросам с красной точкой и перечитай разбор.';
    else verdict='Слабо. Перечитай модули секции и пройди квиз заново — это и есть learning loop.';
    body='<div class="qscore"><div class="big">'+right+' / '+Q.q.length+'</div>'
      +'<div class="lb">'+pct+'% · '+verdict+'</div></div>'
      +'<div class="qnav"><button class="btn sm" onclick="_qReset(&quot;'+key+'&quot;)">↻ пройти заново</button>'
      +'<button class="btn sm gh" onclick="_qReview(&quot;'+key+'&quot;)">◀ разобрать ответы</button>'
      +'<span class="qdots">'+dots+'</span></div>';
  }else{
    const q=Q.q[st.i],picked=st.ans[st.i];
    const marks=['A','B','C','D','E','F'];
    const opts=q.o.map((o,i)=>{
      let cls='qopt';
      if(picked!==undefined&&picked!==null){
        cls+=' locked';
        if(i===q.c)cls+=' right';
        else if(i===picked)cls+=' wrong';
      }
      return '<button class="'+cls+'" '+(picked!==undefined&&picked!==null?'disabled':'')
        +' onclick="_qPick(&quot;'+key+'&quot;,'+i+')"><span class="mk">'+marks[i]+'</span><span>'+o+'</span></button>';
    }).join('');
    const exp=(picked!==undefined&&picked!==null)?'<div class="qexp"><b>'+(picked===q.c?'✓ верно.':'✗ не то.')+'</b> '+q.e+'</div>':'';
    const isLast=st.i===Q.q.length-1;
    body='<div class="qq">'+(st.i+1)+'. '+q.q+'</div><div class="qopts">'+opts+'</div>'+exp
      +'<div class="qnav">'
      +'<button class="btn sm gh" '+(st.i===0?'disabled':'')+' onclick="_qGo(&quot;'+key+'&quot;,-1)">◀ назад</button>'
      +'<button class="btn sm" '+((picked===undefined||picked===null)?'disabled':'')+' onclick="'+(isLast?'_qFinish':'_qGo')+'(&quot;'+key+'&quot;'+(isLast?'':',1')+')">'
      +(isLast?'подвести итог ✓':'дальше ▶')+'</button>'
      +'<span class="qdots">'+dots+'</span></div>';
  }
  const bestBadge=(st.best!==undefined)
    ?'<span class="qbest">лучший: '+st.best+' / '+Q.q.length+'</span>':'';
  host.innerHTML='<div class="quiz"><div class="quiz-head">◈ checkpoint · '+Q.title+bestBadge
    +'<span class="qcount">active recall · '+Q.q.length+' вопросов</span></div>'
    +'<div class="quiz-body">'+body+'</div></div>';
}
function qOk(key){ensureQState();return !!(QUIZZES[key]&&QSTATE[key]);}
window._qPick=function(key,i){if(!qOk(key))return;const st=QSTATE[key];if(st.ans[st.i]!==undefined&&st.ans[st.i]!==null)return;st.ans[st.i]=i;saveQuizState();renderQuiz(key);};
window._qGo=function(key,d){if(!qOk(key))return;const st=QSTATE[key],Q=QUIZZES[key];st.i=Math.max(0,Math.min(Q.q.length-1,st.i+(d||0)));renderQuiz(key);};
window._qFinish=function(key){if(!qOk(key))return;const st=QSTATE[key],Q=QUIZZES[key];st.done=true;
  const right=st.ans.filter((a,i)=>a===Q.q[i].c).length;
  if(st.best===undefined||right>st.best)st.best=right;
  saveQuizState();renderQuiz(key);renderProgressPanel();};
window._qReset=function(key){if(!QUIZZES[key])return;ensureQState();const b=QSTATE[key]?QSTATE[key].best:undefined;
  QSTATE[key]={i:0,ans:[],done:false,best:b};saveQuizState();renderQuiz(key);};
window._qReview=function(key){if(!qOk(key))return;QSTATE[key].done=false;QSTATE[key].i=0;saveQuizState();renderQuiz(key);};

const FCSTATE={tag:'all',i:0,flipped:false,deck:[]};
function fcTags(){const t=['all'];CARDS.forEach(c=>{if(t.indexOf(c.t)<0)t.push(c.t);});return t;}
function fcBuildDeck(){
  FCSTATE.deck=CARDS.filter(c=>FCSTATE.tag==='all'||c.t===FCSTATE.tag);
  FCSTATE.i=0;FCSTATE.flipped=false;
}
function buildCards(){
  const host=document.getElementById('cardsHost');if(!host)return;
  if(!FCSTATE.deck.length)fcBuildDeck();
  renderCards();
}
function renderCards(){
  const host=document.getElementById('cardsHost');if(!host)return;
  const tags=fcTags().map(t=>'<span class="chip'+(FCSTATE.tag===t?' on':'')+'" tabindex="0" role="button"'
    +' onclick="_fcTag(&quot;'+t+'&quot;)" onkeydown="if(event.key===&quot;Enter&quot;){_fcTag(&quot;'+t+'&quot;)}">'+t+'</span>').join('');
  const d=FCSTATE.deck;
  let face;
  if(!d.length){face='<div class="fc"><div class="fc-q">пусто</div></div>';}
  else{
    const c=d[Math.max(0,Math.min(d.length-1,FCSTATE.i))];
    face='<div class="fc" tabindex="0" role="button" aria-label="Перевернуть карточку" onclick="_fcFlip()" onkeydown="if(event.key===&quot;Enter&quot;||event.key===&quot; &quot;){event.preventDefault();_fcFlip()}">'
      +'<div class="fc-side">'+(FCSTATE.flipped?'ответ':'вопрос')+'</div><div class="fc-tag">'+c.t+'</div>'
      +(FCSTATE.flipped?'<div class="fc-a">'+c.a+'</div>':'<div class="fc-q">'+c.q+'</div>')
      +'<div class="fc-hint">'+(FCSTATE.flipped?'клик — назад к вопросу':'клик — показать ответ')+'</div></div>';
  }
  host.innerHTML='<div class="fc-wrap"><div class="fc-filters">'+tags+'</div>'+face
    +'<div class="fc-bar"><button class="btn sm gh" onclick="_fcStep(-1)">◀ пред</button>'
    +'<button class="btn sm" onclick="_fcStep(1)">след ▶</button>'
    +'<button class="btn sm gh" onclick="_fcShuffle()">⇄ перемешать</button>'
    +'<span class="cnt">'+(d.length?(FCSTATE.i+1):0)+' / '+d.length+'</span></div></div>';
}
window._fcTag=function(t){if(fcTags().indexOf(t)<0)return;FCSTATE.tag=t;fcBuildDeck();renderCards();};
window._fcFlip=function(){FCSTATE.flipped=!FCSTATE.flipped;renderCards();};
window._fcStep=function(d){
  d=Number(d)||0;
  if(!FCSTATE.deck.length)return;
  const n=FCSTATE.deck.length;
  FCSTATE.i=((FCSTATE.i+d)%n+n)%n;FCSTATE.flipped=false;renderCards();};
window._fcShuffle=function(){
  const a=FCSTATE.deck;
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}
  FCSTATE.i=0;FCSTATE.flipped=false;renderCards();};

let SIDX=[],SSEL=0;
function buildSearchIndex(){
  SIDX=[];
  MODULES.forEach(m=>{
    SIDX.push({id:m.id,txt:m.title,sub:m.sec});
    const v=document.getElementById('view-'+m.id);if(!v)return;
    v.querySelectorAll('.sect').forEach(h=>{const t=(h.textContent||'').trim();if(t)SIDX.push({id:m.id,txt:t,sub:m.title});});
    v.querySelectorAll('.card-t').forEach(h=>{const t=(h.textContent||'').trim();if(t)SIDX.push({id:m.id,txt:t,sub:m.title});});
  });
}
function openSearch(){
  const o=document.getElementById('searchOverlay');if(!o)return;
  o.classList.add('on');const i=document.getElementById('searchInput');
  if(i){i.value='';i.focus();}
  SSEL=0;renderSearch('');
}
function closeSearch(){const o=document.getElementById('searchOverlay');if(o)o.classList.remove('on');}
function searchHits(q){
  q=(q||'').trim().toLowerCase();
  if(!q)return SIDX.slice(0,9);
  return SIDX.filter(x=>x.txt.toLowerCase().indexOf(q)>=0||x.sub.toLowerCase().indexOf(q)>=0).slice(0,40);
}
function renderSearch(q){
  const box=document.getElementById('searchRes');if(!box)return;
  const hits=searchHits(q);
  if(!hits.length){box.innerHTML='<div class="sres-empty">ничего не найдено</div>';return;}
  if(SSEL>=hits.length)SSEL=hits.length-1;if(SSEL<0)SSEL=0;
  box.innerHTML=hits.map((h,i)=>'<div class="sres-item'+(i===SSEL?' sel':'')+'" onclick="go(&quot;'+h.id+'&quot;);closeSearch()">'
    +h.txt+'<span class="sm">'+h.sub+'</span></div>').join('');
}
document.addEventListener('keydown',function(e){
  const o=document.getElementById('searchOverlay');
  const open=o&&o.classList.contains('on');
  if((e.ctrlKey||e.metaKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();open?closeSearch():openSearch();return;}
  if(!open)return;
  if(e.key==='Escape'){closeSearch();return;}
  const q=(document.getElementById('searchInput')||{}).value||'';
  const hits=searchHits(q);
  if(e.key==='ArrowDown'){e.preventDefault();SSEL=Math.min(hits.length-1,SSEL+1);renderSearch(q);}
  else if(e.key==='ArrowUp'){e.preventDefault();SSEL=Math.max(0,SSEL-1);renderSearch(q);}
  else if(e.key==='Enter'){e.preventDefault();if(hits[SSEL]){go(hits[SSEL].id);closeSearch();}}
});
document.addEventListener('input',function(e){
  if(e.target&&e.target.id==='searchInput'){SSEL=0;renderSearch(e.target.value);}
});

const PPSTATE={mode:'idle',msg:'',ok:true,code:''};
function b64enc(str){try{return btoa(unescape(encodeURIComponent(str)));}catch(e){return '';}}
function b64dec(str){try{return decodeURIComponent(escape(atob(str)));}catch(e){return '';}}
function exportProgress(){
  ensureQState();
  const q={};
  Object.keys(QSTATE).forEach(function(k){
    const st=QSTATE[k];
    q[k]={i:st.i,ans:st.ans,done:st.done,best:st.best};
  });
  return b64enc(JSON.stringify({v:2,prog:getDone(),quiz:q}));
}
function importProgress(str){
  const raw=b64dec(String(str||'').replace(/\s+/g,''));
  if(!raw)return false;
  let d;try{d=JSON.parse(raw);}catch(e){return false;}
  if(!d||d.v!==2||!Array.isArray(d.prog))return false;
  const ids=MODULES.map(function(m){return m.id;});
  lsWrite(LS.p,d.prog.filter(function(x){return typeof x==='string'&&ids.indexOf(x)>=0;}));
  if(d.quiz&&typeof d.quiz==='object')lsWrite(LS.q,d.quiz);
  QSTATE=null;ensureQState();
  refreshProgress();buildNav();buildAllQuizzes();
  return true;
}
function buildProgressPanel(){renderProgressPanel();}
function renderProgressPanel(){
  const el=document.getElementById('progressPanel');if(!el)return;
  ensureQState();
  const done=getDone().filter(function(x){return NOCOUNT.indexOf(x)<0;});
  const total=MODULES.filter(function(m){return NOCOUNT.indexOf(m.id)<0;}).length;
  const qk=Object.keys(QUIZZES);
  const passed=qk.filter(function(k){return QSTATE[k]&&QSTATE[k].best!==undefined;});
  const sum=passed.reduce(function(a,k){return a+QSTATE[k].best;},0);
  const max=passed.reduce(function(a,k){return a+QUIZZES[k].q.length;},0);

  let h='<div class="kv" style="margin-top:0">'
    +'<div class="kv-row"><div class="kv-k">Модули</div><div class="kv-v"><span class="gs">'+done.length+'</span> / '+total+' пройдено</div></div>'
    +'<div class="kv-row"><div class="kv-k">Квизы</div><div class="kv-v">'
    +(passed.length?('<span class="gs">'+passed.length+'</span> / '+qk.length+' пройдено · лучшие результаты в сумме <span class="cy">'+sum+' / '+max+'</span>')
                   :'<span class="dm">ни один ещё не пройден</span>')
    +'</div></div></div>';

  h+='<div class="btn-row" style="margin-top:12px">'
    +'<button class="btn sm" onclick="_ppMode(&quot;export&quot;)">⇧ выгрузить код</button>'
    +'<button class="btn sm" onclick="_ppMode(&quot;import&quot;)">⇩ загрузить код</button>'
    +'<button class="btn sm gh" onclick="_ppMode(&quot;idle&quot;)">свернуть</button>'
    +'<button class="btn sm gh" onclick="resetProgress()">↻ сбросить всё</button></div>';

  if(PPSTATE.mode==='export'){
    const code=exportProgress();
    h+='<div class="code" style="margin-top:12px;max-height:150px;overflow:auto;word-break:break-all;white-space:pre-wrap">'
      +'<span class="code-label">код прогресса</span>'+code+'</div>'
      +'<div class="btn-row"><button class="btn sm" onclick="_ppCopy()">⧉ скопировать</button>'
      +'<span style="font-size:11px;color:#4a5a6e">вставь этот код на другом устройстве</span></div>';
  }
  if(PPSTATE.mode==='import'){
    h+='<div style="margin-top:12px"><input id="ppInput" type="text" placeholder="вставь код прогресса сюда" '
      +'style="width:100%;background:#05090f;border:1px solid rgba(56,189,248,.3);color:#cdd9e5;font-family:inherit;'
      +'font-size:12px;padding:10px 12px;border-radius:7px;outline:none"></div>'

window._ppCopy=function(){
  const code=exportProgress();
  let done=false;
  try{
    if(typeof navigator!=='undefined'&&navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(code);done=true;
    }
  }catch(e){}
  PPSTATE.ok=true;
  PPSTATE.msg=done?'Скопировано в буфер обмена.':'Скопируй код выделением — буфер обмена недоступен.';
  renderProgressPanel();
};
window._ppApply=function(){
  const inp=document.getElementById('ppInput');
  const val=inp?inp.value:'';
  if(importProgress(val)){PPSTATE.ok=true;PPSTATE.msg='Прогресс загружен.';PPSTATE.mode='idle';}
  else{PPSTATE.ok=false;PPSTATE.msg='Не похоже на код прогресса. Проверь, что скопировал строку целиком.';}
  renderProgressPanel();
};

    <p class="tx">Спецификация говорит «GET должен быть safe». Но <span class="hl">никто не мешает разработчику сделать <code class="ic">GET /account/delete?id=5</code></span>, и сервер честно удалит. Это не теория: такие эндпоинты находят регулярно. Последствия: браузерный префетч или антивирусный сканер ссылок могут вызвать удаление; ссылка в письме становится оружием; <span class="rd">SameSite=Lax такой запрос не заблокирует</span>, потому что для него top-level navigation GET — легитимный сценарий. Правило: <span class="hl">любое изменение состояния — только не-safe методом</span>.</p>
    <p class="tx" style="margin-bottom:0">Обратная сторона — <span class="hl">method override</span>. Некоторые фреймворки принимают заголовок <code class="ic">X-HTTP-Method-Override: PUT</code> или параметр <code class="ic">_method=DELETE</code> и трактуют GET/POST как другой метод. Браузер при этом видит исходный метод, а приложение — подменённый. Так обходят и SameSite, и проверки на уровне WAF, и CORS-логику.</p>
  </div>

  <h2 class="sect">статус-коды</h2>
  <p class="tx">Первая цифра кода = класс ответа. Её читают первой, до тела.</p>
  <div class="lab">
    <div class="lab-head"><span class="live-dot"></span>status-codes.live · классы ответов</div>
    <div class="lab-body">
      <p class="tx" style="font-size:12px;margin-bottom:12px">Кликай классы — примеры кодов и что каждый означает для AppSec:</p>
      <div id="statusLab"></div>
    </div>
  </div>
  <div class="card acc-p">
    <div class="card-t">◇ коды как источник информации</div>
    <p class="tx" style="margin:0">Разница между <code class="ic">401</code> и <code class="ic">403</code> — это разница между «я не знаю, кто ты» и «я знаю, кто ты, но тебе нельзя». Разница между <code class="ic">404</code> и <code class="ic">403</code> на скрытом ресурсе — <span class="rd">утечка факта существования</span>: перебирая ID и глядя на коды, можно составить карту приватных объектов, даже не читая их. Поэтому в чувствительных местах правильный ответ на чужой ресурс — <code class="ic">404</code>, а не <code class="ic">403</code>. Ещё сигнал: разное время ответа или разный текст ошибки при существующем и несуществующем логине — это user enumeration.</p>
  </div>

  <h2 class="sect">заголовки</h2>
  <p class="tx">Заголовки — метаданные сообщения. Их сотни; вот те, что нужно знать наизусть.</p>
  <div class="grid2">
    <div class="card acc-c"><div class="card-t">запрос</div><p class="tx" style="font-size:12px;margin:0">
      <code class="ic">Host</code> — какой сайт нужен (обязателен в HTTP/1.1)<br>
      <code class="ic">User-Agent</code> — клиент<br>
      <code class="ic">Cookie</code> — сохранённое состояние<br>
      <code class="ic">Authorization</code> — токен или креды<br>
      <code class="ic">Content-Type</code> — формат тела<br>
      <code class="ic">Origin</code> — откуда пришёл запрос (ключевой для CORS)<br>
      <code class="ic">Referer</code> — с какой страницы перешли (да, с опечаткой — она в стандарте с 1996 года)<br>
      <code class="ic">Accept</code> — что клиент готов принять<br>
      <code class="ic">X-Forwarded-For</code> — цепочка IP через прокси</p></div>
    <div class="card acc-g"><div class="card-t">ответ</div><p class="tx" style="font-size:12px;margin:0">
      <code class="ic">Set-Cookie</code> — выдать cookie<br>
      <code class="ic">Content-Type</code> — формат ответа<br>
      <code class="ic">Content-Length</code> — длина тела<br>
      <code class="ic">Location</code> — куда редиректить<br>
      <code class="ic">Cache-Control</code> — правила кэширования<br>
      <code class="ic">Access-Control-Allow-Origin</code> — политика CORS<br>
      <code class="ic">Content-Security-Policy</code> — политика ресурсов<br>
      <code class="ic">Strict-Transport-Security</code> — только HTTPS<br>
      <code class="ic">Server</code> — что за софт (часто лишняя утечка)</p></div>
  </div>

  <div class="sec-box">
    <div class="sb-t">SEC ▸ заголовки — это данные от клиента</div>
    <p class="tx">Всё, что приходит в заголовках запроса, <span class="rd">задаёт клиент и может подделать</span>. Три частых ошибки в коде:</p>
    <p class="tx"><span class="hl">Доверие <code class="ic">X-Forwarded-For</code></span> — приложение берёт «настоящий IP» из заголовка и по нему принимает решения (разрешить доступ, посчитать rate limit). Атакующий просто подставляет <code class="ic">X-Forwarded-For: 127.0.0.1</code> и обходит и то, и другое. Заголовку можно верить, только если ему проставляет значение твой собственный прокси и он же затирает пришедшее извне.</p>
    <p class="tx"><span class="hl">Доверие <code class="ic">Host</code></span> — приложение строит ссылки на основе Host (например, ссылку восстановления пароля). Атакующий шлёт <code class="ic">Host: evil.com</code>, письмо жертве приходит со ссылкой на его домен, жертва кликает — токен сброса пароля уходит атакующему. Это <span class="rd">password reset poisoning</span>, целый раздел в PortSwigger Academy.</p>
    <p class="tx" style="margin-bottom:0"><span class="hl">Доверие <code class="ic">Referer</code></span> — как защита от CSRF ненадёжна: заголовок легко убирается политикой referrer, а его отсутствие приложения обычно трактуют как «пропустить».</p>
  </div>

  <h2 class="sect">HTTP не имеет памяти</h2>
  <p class="tx">Ключевое свойство протокола: <span class="hl">HTTP stateless</span>. Каждый запрос обрабатывается как первый и единственный — сервер по протоколу не знает, что минуту назад ты логинился. Это сделано осознанно: так проще масштабировать, любой сервер из сотни может обслужить любой запрос.</p>
  <p class="tx">Но приложениям нужна память. Решение придумали в 1994 году — <span class="cy">cookies</span>: сервер выдаёт метку через <code class="ic">Set-Cookie</code>, браузер возвращает её в каждом следующем запросе через <code class="ic">Cookie</code>. Так поверх stateless-протокола появляется stateful-сессия. Из этого «костыля» растёт половина веб-уязвимостей — угон сессии, CSRF, фиксация сессии. Подробно в модуле 11.</p>

  <div class="ask-box">
    <div class="sb-t">на собесе спросят</div>
    <div class="q">— В чём разница между safe и idempotent?</div>
    <div class="a">Safe — запрос вообще не меняет состояние (GET, HEAD, OPTIONS). Idempotent — меняет, но повтор не добавляет эффекта (PUT, DELETE). Всё safe автоматически idempotent, обратное неверно: <span class="cy">DELETE</span> не safe, но idempotent. <span class="cy">POST</span> не является ни тем, ни другим — поэтому браузер и переспрашивает при обновлении страницы после отправки формы, и поэтому повторный POST создаёт второй заказ.</div>
    <div class="q">— Зачем нужен заголовок Host, если мы уже подключились по IP?</div>
    <div class="a">Потому что на одном IP живут сотни сайтов (virtual hosting). TCP-соединение приводит к машине, а Host говорит, чей контент отдавать. В HTTP/1.1 он <span class="hl">обязателен</span> — без него сервер должен вернуть 400. Отсюда и класс атак Host header injection: если приложение использует значение Host для построения ссылок, редиректов или ключей кэша, атакующий влияет на них напрямую.</div>
    <div class="q">— Что значит «HTTP stateless» и как тогда работает логин?</div>
    <div class="a">Протокол не связывает запросы между собой: каждый самодостаточен. Состояние добавляется слоем выше — cookie с идентификатором сессии, которую браузер автоматически прикладывает к каждому запросу к этому домену. Именно из этого «автоматически» вырастает CSRF: браузер приложит cookie и к запросу, который инициировал чужой сайт.</div>
  </div>

  <h2 class="sect">референсы модуля</h2>
  <a class="ref rfc" href="https://www.rfc-editor.org/rfc/rfc9110.html" target="_blank" rel="noopener"><span class="r-t">RFC 9110 — HTTP Semantics</span><span class="r-d">актуальная спецификация семантики HTTP: методы, коды, заголовки. Заменила RFC 7231 и старый 2616.</span><span class="r-u">rfc-editor.org/rfc/rfc9110.html</span></a>
  <a class="ref" href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Messages" target="_blank" rel="noopener"><span class="r-t">MDN — HTTP Messages</span><span class="r-d">разбор структуры запроса и ответа с примерами. Первое, что стоит открыть после этого модуля.</span><span class="r-u">developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Messages</span></a>
  <a class="ref" href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status" target="_blank" rel="noopener"><span class="r-t">MDN — HTTP status codes</span><span class="r-d">полный справочник кодов. Держи в закладках, наизусть учить не нужно.</span><span class="r-u">developer.mozilla.org/en-US/docs/Web/HTTP/Reference/Status</span></a>
  <a class="ref ps" href="https://portswigger.net/web-security/host-header" target="_blank" rel="noopener"><span class="r-t">PortSwigger — HTTP Host header attacks</span><span class="r-d">password reset poisoning, отравление кэша, обход контроля доступа через Host.</span><span class="r-u">portswigger.net/web-security/host-header</span></a>

  <div class="btn-row" style="margin-top:26px">
    <button class="btn" onclick="markDone('http');go('httpv')">[✓] завершить → версии, прокси, кэш</button>
  </div>

  </div>

  <h2 class="sect">кэширование</h2>
  <p class="tx">Кэш хранит ответ и отдаёт его следующим запросам, не беспокоя сервер. Кэш бывает приватный (в браузере, только для тебя) и общий (CDN, прокси — <span class="hl">один ответ на многих пользователей</span>). Именно вторая разновидность интересна атакующему.</p>
  <div class="code"><span class="code-label">cache headers</span><span class="cmt"># сервер управляет кэшем через заголовки ответа</span>
<span class="fn">Cache-Control</span>: public, max-age=3600        <span class="cmt">← можно кэшировать всем на час</span>
<span class="fn">Cache-Control</span>: private, no-cache          <span class="cmt">← только браузер, и каждый раз перепроверять</span>
<span class="fn">Cache-Control</span>: no-store                   <span class="cmt">← не хранить нигде (для персональных данных)</span>
<span class="fn">ETag</span>: "a3f5b1"                            <span class="cmt">← отпечаток версии ресурса</span>
<span class="fn">Vary</span>: Origin, Accept-Encoding             <span class="cmt">← от каких заголовков зависит ответ</span></div>

  <p class="tx"><span class="hl">Ключ кэша</span> — то, по чему кэш решает «это тот же самый запрос». Обычно это метод + хост + путь + query. А вот заголовки в ключ по умолчанию <span class="rd">не входят</span> — если только их не перечислили в <code class="ic">Vary</code>. Заголовок, который влияет на ответ, но не входит в ключ, называется <span class="cy">unkeyed input</span>, и это фундамент двух атак.</p>

  <div class="sec-box">
    <div class="sb-t">SEC ▸ две атаки на кэш — не путать</div>
    <p class="tx"><span class="hl">Web Cache Poisoning (отравление)</span> — атакующий отправляет запрос со специальным unkeyed-заголовком, сервер генерирует <span class="rd">вредоносный ответ</span>, кэш его сохраняет под обычным ключом и раздаёт всем последующим пользователям. Направление: атакующий → кэш → жертвы. Результат — массовый XSS или редирект для всех посетителей страницы.</p>
    <p class="tx"><span class="hl">Web Cache Deception (обман)</span> — атакующий заманивает жертву на ссылку вида <code class="ic">/account/profile.css</code>. Приложение игнорирует лишнее расширение и отдаёт <span class="rd">персональные данные жертвы</span>, а кэш видит «.css» и решает, что это публичная статика, — и сохраняет. Дальше атакующий сам открывает этот URL и читает чужие данные. Направление: жертва → кэш → атакующий.</p>
    <p class="tx" style="margin-bottom:0">Мнемоника: <span class="cy">poisoning</span> — атакующий кладёт своё в кэш <span class="hl">для других</span>. <span class="cy">deception</span> — атакующий заставляет кэш сохранить чужое <span class="hl">для себя</span>.</p>
  </div>

  <div class="sec-box">
    <div class="sb-t">SEC ▸ request smuggling в двух абзацах</div>
    <p class="tx">В HTTP/1.1 по одному соединению между фронтендом и бэкендом идут запросы разных пользователей подряд. Длину тела можно указать двумя способами: <code class="ic">Content-Length</code> (число байт) и <code class="ic">Transfer-Encoding: chunked</code> (кусками, до нулевого чанка). Спецификация говорит: если есть оба — приоритет у <code class="ic">Transfer-Encoding</code>. Но на практике разные серверы решают конфликт по-разному.</p>
    <p class="tx" style="margin-bottom:0">Если фронтенд поверил одному заголовку, а бэкенд другому, они <span class="rd">разойдутся в том, где кончается запрос</span>. «Лишний» хвост останется в буфере бэкенда и приклеится к началу следующего запроса — который принадлежит другому пользователю. Так атакующий подменяет чужой запрос: угоняет сессии, обходит контроль доступа, доставляет XSS. Варианты называются <code class="ic">CL.TE</code>, <code class="ic">TE.CL</code> и <code class="ic">TE.TE</code> по тому, кто чему поверил. Глубоко разберёшь на PortSwigger — сейчас достаточно понимать причину: <span class="hl">два парсера, одна строка, разные выводы</span>.</p>
  </div>

  <div class="ask-box">
    <div class="sb-t">на собесе спросят</div>
    <div class="q">— Почему HTTP/2 в принципе не подвержен классическому request smuggling?</div>
    <div class="a">Потому что в HTTP/2 длина тела определяется структурой бинарных фреймов, а не текстовыми заголовками — двусмысленности «CL против TE» просто нет. Но если фронтенд принимает HTTP/2 и понижает соединение до HTTP/1.1 к бэкенду, он конвертирует запрос обратно в текст — и если внутри HTTP/2-запроса протащить скрытый заголовок <code class="ic">Transfer-Encoding</code>, он материализуется на этапе конвертации. Это <span class="cy">H2.CL</span> и <span class="cy">H2.TE</span> downgrade-атаки.</div>
    <div class="q">— В чём разница между cache poisoning и cache deception?</div>
    <div class="a">В том, кто жертва и что попадает в кэш. При <span class="cy">poisoning</span> атакующий кладёт в общий кэш свой вредоносный ответ, и его получают все остальные пользователи. При <span class="cy">deception</span> в кэш попадает приватный ответ жертвы, и его забирает атакующий. Первое — атака на многих, второе — кража у одного.</div>
    <div class="q">— Зачем нужен заголовок <code class="ic">Vary</code> и что будет, если его забыть?</div>
    <div class="a"><code class="ic">Vary</code> добавляет перечисленные заголовки в ключ кэша. Классический промах: сервер динамически отражает <code class="ic">Origin</code> в <code class="ic">Access-Control-Allow-Origin</code>, но не ставит <code class="ic">Vary: Origin</code>. Тогда кэш сохранит ответ с ACAO для одного origin и отдаст его всем — и политика CORS для остальных клиентов окажется чужой. Это уже уязвимость, а не только баг производительности.</div>
  </div>

  <h2 class="sect">референсы модуля</h2>
  <a class="ref rfc" href="https://www.rfc-editor.org/rfc/rfc9112.html" target="_blank" rel="noopener"><span class="r-t">RFC 9112 — HTTP/1.1</span><span class="r-d">актуальная спецификация синтаксиса 1.1: тут же формальные правила про Content-Length и Transfer-Encoding.</span><span class="r-u">rfc-editor.org/rfc/rfc9112.html</span></a>
  <a class="ref rfc" href="https://www.rfc-editor.org/rfc/rfc9114.html" target="_blank" rel="noopener"><span class="r-t">RFC 9114 — HTTP/3</span><span class="r-d">отображение семантики HTTP на QUIC.</span><span class="r-u">rfc-editor.org/rfc/rfc9114.html</span></a>
  <a class="ref" href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching" target="_blank" rel="noopener"><span class="r-t">MDN — HTTP Caching</span><span class="r-d">Cache-Control, ETag, ревалидация, приватный и общий кэш.</span><span class="r-u">developer.mozilla.org/en-US/docs/Web/HTTP/Guides/Caching</span></a>
  <a class="ref ps" href="https://portswigger.net/web-security/request-smuggling" target="_blank" rel="noopener"><span class="r-t">PortSwigger — HTTP request smuggling</span><span class="r-d">лучший в мире материал по теме, с лабами. Возвращайся сюда после курса.</span><span class="r-u">portswigger.net/web-security/request-smuggling</span></a>
  <a class="ref ps" href="https://portswigger.net/web-security/web-cache-poisoning" target="_blank" rel="noopener"><span class="r-t">PortSwigger — Web cache poisoning</span><span class="r-d">unkeyed inputs, практика поиска и эксплуатации.</span><span class="r-u">portswigger.net/web-security/web-cache-poisoning</span></a>

  <h2 class="sect">checkpoint: секция PROTOCOL</h2>
  <p class="tx">Два модуля про HTTP позади. Проверь себя — вопросы построены так, как их задают на собеседовании: не «что такое GET», а «что из этого следует».</p>
  <div id="quiz-protocol"></div>

  <div class="btn-row" style="margin-top:26px">
    <button class="btn" onclick="markDone('httpv');go('html')">[✓] завершить секцию → HTML, CSS, JS</button>
  </div>
</section>`;

  <p class="tx">До 2005 года любое действие означало полную перезагрузку страницы. Нажал «лайк» — браузер ушёл на сервер, получил новый HTML целиком, отрисовал всё заново. Медленно и неудобно.</p>
  <p class="tx">Технология <span class="cy">AJAX</span> (термин ввёл Jesse James Garrett в феврале 2005) позволила скрипту сходить на сервер <span class="hl">в фоне</span>, получить кусочек данных и обновить только нужную часть страницы. Сначала через <code class="ic">XMLHttpRequest</code>, сегодня — через современный <code class="ic">fetch()</code>.</p>

  <div class="ascii"><span class="h">БЕЗ AJAX (Web 1.0)</span>                <span class="h">С AJAX (Web 2.0)</span>

  клик                              клик
   │                                 │
   ▼                                 ▼
  <span class="r">ПОЛНАЯ перезагрузка</span>              <span class="g">fetch() в фоне</span>
   │  сервер собирает                │  сервер отдаёт
   │  весь HTML заново               │  только JSON: {"likes":42}
   ▼                                 ▼
  <span class="r">белый экран, всё мигает</span>          <span class="g">JS меняет один элемент</span>
   │                                 │
   ▼                                 ▼
  страница отрисована заново        страница не дёрнулась</div>

  <p class="tx">Последствие оказалось шире, чем «стало удобнее»: раз сервер теперь отдаёт <span class="hl">данные, а не разметку</span>, значит его можно отделить от интерфейса. Так родились API, а из них — мобильные приложения, интеграции, партнёрские сервисы. Весь современный веб вырос из этого сдвига.</p>

  <div class="sec-box">
    <div class="sb-t">SEC ▸ что изменилось для атакующего</div>
    <p class="tx">Раньше поверхность атаки = набор страниц. Теперь поверхность атаки = <span class="hl">набор API-эндпоинтов</span>, и он гораздо больше того, что видно в интерфейсе. Кнопка «удалить» может быть скрыта для обычного пользователя в UI, но эндпоинт <code class="ic">DELETE /api/users/42</code> продолжает работать. Отсюда правило номер один в API-безопасности: <span class="rd">скрыть элемент в интерфейсе — не значит закрыть доступ</span>. Проверка прав должна быть на сервере, на каждом эндпоинте, на каждый объект.</p>
    <p class="tx" style="margin-bottom:0">Второе следствие: логика переехала на клиент. Валидация формы, расчёт цены, проверка роли — если это делает JS в браузере, атакующий просто не запускает этот JS и шлёт запрос напрямую. Всё, что видно в исходниках фронтенда, включая «скрытые» админские маршруты и ключи, — известно атакующему.</p>
  </div>

  <h2 class="sect">где рендерится HTML: четыре стратегии</h2>
  <div class="twrap"><table class="t">

      <td class="cy">SSR<br><span class="dm">server-side</span></td>

      <td>Быстрый первый показ, хорошо индексируется</td>
      <td>Инъекции в шаблон на сервере: reflected XSS и <span class="rd">SSTI</span>. Данные пользователя попадают в HTML на сервере.</td>
    </tr>
    <tr>
      <td class="gs">CSR / SPA<br><span class="dm">client-side</span></td>
      <td>Браузер, из JSON</td>
      <td>Плавный интерфейс, нет перезагрузок</td>
      <td>Смещение в <span class="rd">DOM-based XSS</span>, вся авторизация только на API, токены в браузере, роутинг на клиенте легко обойти.</td>
    </tr>
    <tr>
      <td class="am">SSG<br><span class="dm">static</span></td>

      <td>Максимально быстро и дёшево, минимум поверхности</td>

      <td>Сервер отдаёт HTML, клиент «оживляет»</td>

      <div id="archLab"></div>

    </div>
    <div class="card acc-p">

  </div>

  <div class="ask-box">
    <div class="sb-t">на собесе спросят</div>

  </div>

  <h2 class="sect">референсы модуля</h2>
  <a class="ref" href="https://web.dev/articles/rendering-on-the-web" target="_blank" rel="noopener"><span class="r-t">web.dev — Rendering on the Web</span><span class="r-d">каноническое сравнение SSR, CSR, SSG и гидратации от команды Google.</span><span class="r-u">web.dev/articles/rendering-on-the-web</span></a>

  <span class="h">браузер сверяет: Origin в списке разрешённых?</span>
     <span class="g">да</span>  → отдаёт ответ скрипту
     <span class="r">нет</span> → ответ УЖЕ ПОЛУЧЕН, но скрипту не отдаётся,
           в консоли — CORS error</div>

  <div class="card acc-r">
    <div class="card-t">⚡ проверка происходит в браузере, а не на сервере</div>
    <p class="tx" style="margin:0">CORS — это <span class="hl">поведение браузера</span>. Сервер лишь присылает подсказки в заголовках. Из этого два практических следствия. Первое: <code class="ic">curl</code>, Postman, Burp и любой скрипт на бэкенде <span class="rd">игнорируют CORS полностью</span> — там нет браузера, который бы применял правило. Второе: CORS не защищает сервер ни от чего. Он защищает <span class="hl">данные пользователя от чужого скрипта в его браузере</span>. Настоящая защита эндпоинта — авторизация на сервере.</p>
  </div>

  <h2 class="sect">simple request против preflight</h2>
  <p class="tx">Часть запросов браузер отправляет сразу, а часть — только после предварительного разрешения. Граница проходит по историческому принципу: <span class="hl">если такой запрос можно было сделать HTML-формой ещё до появления CORS, он «простой»</span> и разрешение не требуется — ведь атакующий и так мог его отправить.</p>

  <div class="lab">
    <div class="lab-head"><span class="live-dot"></span>preflight-check.live · будет ли OPTIONS?</div>
    <div class="lab-body">
      <p class="tx" style="font-size:12px;margin-bottom:12px">Собери запрос — метод, Content-Type, дополнительный заголовок — и увидишь, полетит ли preflight и почему:</p>
      <div id="corsLab"></div>
    </div>
  </div>

  <div class="twrap"><table class="t">
    <tr><th></th><th>Simple (без preflight)</th><th>Требует preflight</th></tr>
    <tr><td class="cy">Метод</td><td class="gs">GET, HEAD, POST</td><td class="am">PUT, PATCH, DELETE и любые другие</td></tr>
    <tr><td class="cy">Content-Type</td><td class="gs"><code class="ic">application/x-www-form-urlencoded</code><br><code class="ic">multipart/form-data</code><br><code class="ic">text/plain</code></td><td class="am"><code class="ic">application/json</code> и всё остальное</td></tr>
    <tr><td class="cy">Заголовки</td><td class="gs">только safelisted: Accept, Accept-Language, Content-Language, Content-Type (с ограничением выше), Range</td><td class="am">любой кастомный: <code class="ic">Authorization</code>, <code class="ic">X-CSRF-Token</code>, <code class="ic">X-Requested-With</code></td></tr>
    <tr><td class="cy">Прочее</td><td class="gs">без обработчиков на upload, без ReadableStream в теле</td><td class="am">—</td></tr>
  </table></div>

  <div class="card acc-a">
    <div class="card-t">◇ уточнение про X-Requested-With</div>
    <p class="tx" style="margin:0">Заголовок <code class="ic">X-Requested-With</code> <span class="hl">не входит</span> в список CORS-safelisted request headers по спецификации Fetch. Значит, его добавление <span class="hl">триггерит preflight</span> — и именно поэтому его исторически использовали как признак «этот запрос сделан нашим JS, а не сторонней формой». В конспектах и статьях встречается обратное утверждение — это ошибка, сверяйся со спецификацией. При этом как самостоятельная защита от CSRF этот приём слабый: он ломается, если на сервере разрешена широкая CORS-политика или где-то есть обход preflight.</p>
  </div>

  <h2 class="sect">как выглядит preflight</h2>
  <div class="code"><span class="code-label">1 · браузер спрашивает разрешение</span><span class="kw">OPTIONS</span> /api/orders/42 HTTP/1.1
Host: api.example.com
<span class="fn">Origin</span>: https://app.example.com
<span class="fn">Access-Control-Request-Method</span>: DELETE
<span class="fn">Access-Control-Request-Headers</span>: authorization</div>
  <div class="code"><span class="code-label">2 · сервер отвечает</span>HTTP/1.1 <span class="op">204</span> No Content
<span class="fn">Access-Control-Allow-Origin</span>: https://app.example.com
<span class="fn">Access-Control-Allow-Methods</span>: GET, POST, DELETE
<span class="fn">Access-Control-Allow-Headers</span>: authorization
<span class="fn">Access-Control-Allow-Credentials</span>: true
<span class="fn">Access-Control-Max-Age</span>: 600
<span class="fn">Vary</span>: Origin</div>
  <p class="tx">Только после этого уходит настоящий <code class="ic">DELETE</code>. Ответ preflight кэшируется на <code class="ic">Access-Control-Max-Age</code> секунд — но это <span class="hl">пожелание</span>: браузеры ограничивают значение своим потолком, так что рассчитывать на сутки кэша не стоит.</p>

  <div class="kv">
    <div class="kv-row"><div class="kv-k">Access-Control-Allow-Origin</div><div class="kv-v">Кому можно читать ответ. Либо конкретный origin, либо <code class="ic">*</code>. <span class="hl">Списка несколько значений тут быть не может</span> — сервер обязан выбрать один и подставить его.</div></div>
    <div class="kv-row"><div class="kv-k">Access-Control-Allow-Credentials</div><div class="kv-v"><code class="ic">true</code> разрешает браузеру приложить и прочитать <span class="hl">credentials</span> — то есть cookies, клиентский TLS-сертификат и данные HTTP-аутентификации через браузерный диалог. Внимание на частую путаницу: <span class="rd">заголовок <code class="ic">Authorization: Bearer ...</code>, который приложение проставляет само из JS, сюда не относится</span> — это обычный несафлистовый заголовок, и разрешается он через <code class="ic">Access-Control-Allow-Headers</code>. Bearer-токен спокойно ходит cross-origin и без этого заголовка; ограничение на сочетание с <code class="ic">*</code> касается именно cookies.</div></div>
    <div class="kv-row"><div class="kv-k">Access-Control-Allow-Methods</div><div class="kv-v">Какие методы разрешены (только в ответе на preflight).</div></div>
    <div class="kv-row"><div class="kv-k">Access-Control-Allow-Headers</div><div class="kv-v">Какие нестандартные заголовки разрешены в запросе.</div></div>
    <div class="kv-row"><div class="kv-k">Access-Control-Expose-Headers</div><div class="kv-v">Какие заголовки <span class="hl">ответа</span> скрипт сможет прочитать. По умолчанию доступно лишь несколько базовых.</div></div>
    <div class="kv-row"><div class="kv-k">Vary: Origin</div><div class="kv-v">Обязателен, если ACAO формируется динамически. Иначе кэш сохранит ответ для одного origin и раздаст его другим.</div></div>
  </div>

  <div class="card acc-c">
    <div class="card-t">◇ почему <code class="ic">*</code> и credentials несовместимы</div>
    <p class="tx" style="margin:0">Спецификация запрещает сочетание <code class="ic">Access-Control-Allow-Origin: *</code> с <code class="ic">Access-Control-Allow-Credentials: true</code>, и браузер такой ответ отвергнет. Логика простая: «*» означает «любому сайту», а credentials означает «с cookies пользователя». Вместе это давало бы любому сайту в интернете право читать твои персональные данные с любого сервиса, где ты залогинен, — то есть полную отмену SOP.</p>
  </div>

  <h2 class="sect">типовые мисконфиги</h2>
  <div class="sec-box">
    <div class="sb-t">SEC ▸ 1 · отражение Origin</div>
    <p class="tx">Разработчику нужен «список разрешённых», а заголовок принимает только одно значение. Быстрое решение — вернуть то, что пришло:</p>
    <div class="code"><span class="code-label">уязвимо</span>origin = request.headers[<span class="st">'Origin'</span>]
response.headers[<span class="st">'Access-Control-Allow-Origin'</span>] = origin   <span class="cmt">← любой домен</span>
response.headers[<span class="st">'Access-Control-Allow-Credentials'</span>] = <span class="st">'true'</span></div>
    <p class="tx" style="margin-bottom:0">Формально это не <code class="ic">*</code>, поэтому запрет спецификации не срабатывает. Фактически — <span class="rd">любой сайт может читать данные любого залогиненного пользователя</span>. Правильно — сверять со списком строгим равенством и не забыть <code class="ic">Vary: Origin</code>.</p>
  </div>
  <div class="sec-box">
    <div class="sb-t">SEC ▸ 2 · кривая проверка списка</div>
    <p class="tx" style="margin-bottom:0">Сравнение по вхождению подстроки вместо равенства: <code class="ic">origin.endsWith('example.com')</code> пропустит <code class="ic">evilexample.com</code>, а <code class="ic">origin.includes('example.com')</code> — ещё и <code class="ic">example.com.evil.com</code>. Отдельно: разрешение всех поддоменов означает, что <span class="hl">любой захваченный поддомен получает доступ к API</span>. И ещё одна классика — оставить в списке <code class="ic">http://localhost:3000</code> с прода.</p>
  </div>
  <div class="sec-box">
    <div class="sb-t">SEC ▸ 3 · доверие к origin «null»</div>
    <p class="tx" style="margin-bottom:0">Значение <code class="ic">null</code> в заголовке Origin приходит из документов без origin: песочничного iframe (<code class="ic">sandbox</code>), страницы с локального файла, некоторых редиректов. Если сервер отвечает <code class="ic">Access-Control-Allow-Origin: null</code>, атакующий <span class="rd">воспроизводит такой контекст на своей странице</span> и получает доступ. Значение <code class="ic">null</code> в allowlist — всегда находка.</p>
  </div>

  <div class="ask-box">
    <div class="sb-t">на собесе спросят</div>
    <div class="q">— Запрос дошёл до сервера и отработал, но в консоли CORS error. Как так?</div>
    <div class="a">Это нормальное поведение, а не баг. Браузер отправляет запрос, сервер его обрабатывает и отвечает; браузер получает ответ, не находит нужного <code class="ic">Access-Control-Allow-Origin</code> и <span class="hl">не отдаёт ответ скрипту</span>, показывая ошибку. Побочный эффект на сервере при этом уже произошёл. Единственное исключение — если запрос требовал preflight и OPTIONS не был разрешён: тогда основной запрос вообще не уйдёт.</div>
    <div class="q">— Защищает ли CORS от CSRF?</div>
    <div class="a">Нет, и это отдельная ловушка. Классический CSRF использует «простые» запросы — автоотправку HTML-формы или загрузку изображения, — которые preflight не порождают вовсе. Более того, неправильно настроенный CORS <span class="rd">усиливает</span> атакующего: если сервер отражает Origin и разрешает credentials, атакующий получает возможность не только отправлять запросы, но и читать ответы. От CSRF защищают SameSite, CSRF-токены и проверка Origin на сервере.</div>
    <div class="q">— Что не так с конфигурацией <code class="ic">ACAO: *</code> на публичном API без авторизации?</div>
    <div class="a">Само по себе — ничего страшного, если эндпоинт действительно публичный и не отдаёт персональные данные: он и так доступен всем. Проблема начинается, когда рядом с таким API живёт внутренняя сеть или когда тот же обработчик обслуживает и авторизованные запросы. Хороший ответ на собесе: «зависит от того, что отдаёт эндпоинт и есть ли доступ по cookies; для публичной статики нормально, для чего-либо с сессией — нет».</div>
  </div>

  <h2 class="sect">референсы модуля</h2>
  <a class="ref" href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS" target="_blank" rel="noopener"><span class="r-t">MDN — Cross-Origin Resource Sharing</span><span class="r-d">полный разбор: условия simple request, все заголовки, схемы обмена.</span><span class="r-u">developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CORS</span></a>
  <a class="ref" href="https://fetch.spec.whatwg.org/" target="_blank" rel="noopener"><span class="r-t">WHATWG Fetch Standard</span><span class="r-d">первоисточник: определение CORS-safelisted request-header и алгоритм проверки. Именно им сверяются спорные утверждения.</span><span class="r-u">fetch.spec.whatwg.org</span></a>
  <a class="ref ps" href="https://portswigger.net/web-security/cors" target="_blank" rel="noopener"><span class="r-t">PortSwigger — CORS</span><span class="r-d">все мисконфиги с лабами: отражение origin, null, доверие поддоменам.</span><span class="r-u">portswigger.net/web-security/cors</span></a>
  <a class="ref owasp" href="https://owasp.org/www-project-web-security-testing-guide/latest/4-Web_Application_Security_Testing/11-Client-side_Testing/07-Testing_Cross_Origin_Resource_Sharing" target="_blank" rel="noopener"><span class="r-t">OWASP WSTG — Testing CORS</span><span class="r-d">методика проверки: что и чем тестировать, какие заголовки смотреть.</span><span class="r-u">owasp.org/.../07-Testing_Cross_Origin_Resource_Sharing</span></a>

  <div class="btn-row" style="margin-top:26px">
    <button class="btn" onclick="markDone('cors');go('csp')">[✓] завершить → CSP</button>

  <div class="card acc-a">
    <div class="card-t">◇ strict-dynamic — что это решает</div>
    <p class="tx" style="margin:0">Проблема nonce: сторонние библиотеки часто сами подгружают другие скрипты, и им негде взять nonce. Ключевое слово <code class="ic">'strict-dynamic'</code> говорит: «скрипт, который прошёл проверку по nonce или hash, <span class="hl">получает право загружать другие скрипты</span>». При этом список доменов игнорируется — доверие передаётся по цепочке, а не по адресу. Это рекомендуемая современная конструкция:</p>
    <div class="code" style="margin-bottom:0"><span class="code-label">strict CSP</span><span class="fn">Content-Security-Policy</span>:
  script-src 'nonce-{RANDOM}' 'strict-dynamic' https: 'unsafe-inline';
  object-src 'none';
  base-uri 'none';
  frame-ancestors 'none';
  require-trusted-types-for 'script';</div>
  </div>
  <p class="tx" style="font-size:12px">Про хвост <code class="ic">https: 'unsafe-inline'</code>: это <span class="hl">обратная совместимость</span>, а не дыра. Современный браузер, увидев nonce, автоматически игнорирует <code class="ic">'unsafe-inline'</code>, а увидев <code class="ic">'strict-dynamic'</code> — игнорирует список источников. Старый браузер, не знающий этих ключевых слов, откатится на менее строгую, но рабочую политику.</p>

  <div class="sec-box">
    <div class="sb-t">SEC ▸ чем убивают собственную политику</div>
    <p class="tx"><span class="hl">'unsafe-inline' в script-src</span> — разрешает inline-скрипты, обработчики событий и <code class="ic">javascript:</code>. То есть ровно то, чем эксплуатируется XSS. Политика с ним <span class="rd">не защищает от XSS вообще</span>, хотя формально «CSP включён».</p>
    <p class="tx"><span class="hl">'unsafe-eval'</span> — открывает <code class="ic">eval</code>, <code class="ic">new Function</code>, строковые <code class="ic">setTimeout</code>. Часто тянется старыми фреймворками и шаблонизаторами.</p>
    <p class="tx"><span class="hl">статический nonce</span> — если значение не меняется от ответа к ответу, атакующий читает его из исходника страницы и подставляет в свой payload. Nonce обязан быть криптослучайным и одноразовым, иначе он декоративный.</p>
    <p class="tx"><span class="hl">wildcard и широкие домены</span> — <code class="ic">script-src *</code> или разрешение целого хостинга статики, где кто угодно может загрузить свой файл.</p>
    <p class="tx"><span class="hl">JSONP на разрешённом домене</span> — <code class="ic">&lt;script src="https://trusted.com/api?callback=alert(1)"&gt;</code>. Домен в списке, значит браузер разрешает; а сервер услужливо оборачивает произвольную строку в исполняемый код.</p>
    <p class="tx" style="margin-bottom:0"><span class="hl">забытые base-uri и object-src</span> — два обхода, которые не закрываются одним script-src. Поэтому обе директивы ставят в <code class="ic">'none'</code> почти всегда.</p>
  </div>

  <h2 class="sect">как внедрять, не сломав продакшен</h2>
  <p class="tx">Готовая политика на живом сайте почти наверняка что-то сломает. Порядок действий, который работает:</p>
  <div class="kv">
    <div class="kv-row"><div class="kv-k">1 · Report-Only</div><div class="kv-v">Включить <code class="ic">Content-Security-Policy-Report-Only</code>: браузер <span class="hl">ничего не блокирует</span>, только шлёт отчёты о том, что заблокировал бы. Собрать данные на реальном трафике.</div></div>
    <div class="kv-row"><div class="kv-k">2 · Разобрать отчёты</div><div class="kv-v">Отделить легитимное (аналитика, платёжный виджет, шрифты) от лишнего. Часто на этом шаге находится софт, о котором в команде уже забыли.</div></div>
    <div class="kv-row"><div class="kv-k">3 · Убрать inline</div><div class="kv-v">Вынести inline-скрипты в файлы или проставить им nonce. Это основная работа и основное сопротивление со стороны разработки.</div></div>
    <div class="kv-row"><div class="kv-k">4 · Включить в блокирующем режиме</div><div class="kv-v">Сначала на части трафика или на одном разделе, потом на всём. Report-Only при этом можно оставить параллельно с более строгой политикой.</div></div>
    <div class="kv-row"><div class="kv-k">5 · Проверить</div><div class="kv-v">Прогнать политику через Google CSP Evaluator — он покажет, обходится ли она известными способами.</div></div>
  </div>

  <div class="card acc-p">
    <div class="card-t">◇ ответ на «бизнес просит оставить inline-скрипты»</div>
    <p class="tx" style="margin:0">Правильная позиция для AppSec — не «нельзя», а «вот варианты». Три ступени: <span class="hl">nonce</span> (inline остаётся, но с одноразовой меткой — минимум правок в шаблонах), <span class="hl">hash</span> (для inline, который не меняется, — сервер править вообще не надо), <span class="hl">поэтапный вынос</span> с Report-Only и дедлайном. И честная оценка риска: политика с <code class="ic">'unsafe-inline'</code> не даёт защиты от XSS, поэтому если её оставляют — это осознанно принятый риск, зафиксированный письменно, а не «у нас есть CSP».</p>
  </div>

  <div class="ask-box">
    <div class="sb-t">на собесе спросят</div>
    <div class="q">— В чём разница между nonce и hash, когда что использовать?</div>
    <div class="a"><span class="cy">Nonce</span> — случайное значение на каждый ответ, требует динамической генерации страницы; подходит для меняющегося inline-кода и для серверного рендеринга. <span class="cy">Hash</span> — отпечаток конкретного содержимого; подходит для неизменного inline и для статических страниц, где сервера с логикой нет вовсе. Ключевое условие для nonce — <span class="hl">он должен быть новым при каждом запросе</span>, иначе защиты нет. Со <code class="ic">'strict-dynamic'</code> работают оба.</div>
    <div class="q">— Чем CSP отличается от CORS?</div>
    <div class="a">Разные задачи и разные направления. <span class="cy">CSP</span> — <span class="hl">исходящая</span> политика: что моя страница имеет право грузить и исполнять; защищает от XSS и от подгрузки чужого кода. <span class="cy">CORS</span> — <span class="hl">входящая</span>: кому позволено читать ответы моего сервера; ослабляет SOP. CSP настраивает владелец страницы для себя, CORS — владелец API для чужих клиентов.</div>
    <div class="q">— Заменяет ли CSP экранирование вывода?</div>
    <div class="a">Нет. CSP — второй рубеж (defense in depth). Первый и главный — корректное контекстное экранирование и безопасные шаблонизаторы. CSP снижает <span class="hl">последствия</span> XSS: даже при сработавшей инъекции скрипт не загрузится с чужого домена и не сможет отправить украденное, если <code class="ic">connect-src</code> закрыт. Но полагаться на CSP как на единственную защиту нельзя — обходы находят регулярно.</div>
  </div>

  <h2 class="sect">референсы модуля</h2>
  <a class="ref" href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP" target="_blank" rel="noopener"><span class="r-t">MDN — Content Security Policy</span><span class="r-d">полный справочник директив и значений с примерами.</span><span class="r-u">developer.mozilla.org/en-US/docs/Web/HTTP/Guides/CSP</span></a>
  <a class="ref" href="https://www.w3.org/TR/CSP3/" target="_blank" rel="noopener"><span class="r-t">W3C — Content Security Policy Level 3</span><span class="r-d">спецификация. Формальная семантика strict-dynamic и nonce.</span><span class="r-u">w3.org/TR/CSP3</span></a>
  <a class="ref" href="https://csp-evaluator.withgoogle.com/" target="_blank" rel="noopener"><span class="r-t">Google CSP Evaluator</span><span class="r-d">вставь свою политику и получи список обходов. Обязательный инструмент, спрашивают о нём на собесах.</span><span class="r-u">csp-evaluator.withgoogle.com</span></a>
  <a class="ref" href="https://web.dev/articles/strict-csp" target="_blank" rel="noopener"><span class="r-t">web.dev — Mitigate XSS with a strict CSP</span><span class="r-d">практическое руководство по внедрению nonce-based политики, включая совместимость.</span><span class="r-u">web.dev/articles/strict-csp</span></a>
  <a class="ref ps" href="https://portswigger.net/web-security/cross-site-scripting/content-security-policy" target="_blank" rel="noopener"><span class="r-t">PortSwigger — CSP и её обходы</span><span class="r-d">взгляд атакующего: как ищут дыры в политике.</span><span class="r-u">portswigger.net/web-security/cross-site-scripting/content-security-policy</span></a>

  <div class="btn-row" style="margin-top:26px">

    <div class="a">Потому что «правильный» бывает не везде. Загруженные пользователями файлы, статика с другого сервиса, ошибочные ответы приложения, старые обработчики — везде может уехать неверный или пустой тип. <code class="ic">nosniff</code> — дешёвая страховка, которая делает поведение браузера предсказуемым: <span class="hl">верить только заявленному типу</span>. Отдельно он блокирует загрузку скриптов и стилей с неподходящим MIME, что мешает ряду атак через загрузку файлов.</div>
    <div class="q">— X-Frame-Options или frame-ancestors?</div>
    <div class="a"><code class="ic">frame-ancestors</code> — современный и более гибкий вариант: поддерживает список из нескольких origin, работает по правилам CSP. <code class="ic">X-Frame-Options</code> умеет только DENY и SAMEORIGIN. При наличии обоих браузер выполняет CSP, а XFO игнорирует. Практика — ставить оба ради старых клиентов. И отдельно помнить: <span class="rd">X-Frame-Options в теге meta не работает вообще</span>, только как HTTP-заголовок.</div>
    <div class="q">— Чем Fetch Metadata лучше проверки Referer или Origin?</div>
    <div class="a">Эти заголовки проставляет сам браузер, и скрипт их подделать не может — они защищены префиксом <code class="ic">Sec-</code>. <code class="ic">Referer</code> может отсутствовать вовсе (по политике referrer или из соображений приватности), и приложения обычно вынуждены трактовать его отсутствие как «пропустить». <code class="ic">Origin</code> присутствует не во всех типах запросов. <code class="ic">Sec-Fetch-Site</code> есть всегда и однозначно говорит об отношении инициатора к цели.</div>
