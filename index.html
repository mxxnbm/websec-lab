  o:['Заголовок работает только в HTTP/2','Клиент может подставить в этот заголовок что угодно','Заголовок удаляется браузером','Он конфликтует с CORS'],
  c:1,e:'Любой заголовок запроса задаёт клиент. Доверять X-Forwarded-For можно только если значение проставляет твой собственный прокси, и он же затирает всё, что пришло снаружи. Иначе это обход и контроля доступа, и rate limiting.'},
 {q:'Почему классический request smuggling невозможен в чистом HTTP/2?',
  o:['HTTP/2 шифрует заголовки через HPACK','В HTTP/2 длина тела задаётся структурой фреймов, а не двумя конкурирующими заголовками','HTTP/2 не поддерживает keep-alive','В HTTP/2 нет метода POST'],
  c:1,e:'Двусмысленности «Content-Length против Transfer-Encoding» просто нет. Но если фронтенд понижает соединение до HTTP/1.1 перед бэкендом, при конвертации может материализоваться протащенный заголовок — это downgrade-атаки H2.CL и H2.TE.'},
 {q:'Атакующий заманивает жертву на <code class="ic">/account/profile.css</code>. Приложение игнорирует расширение и отдаёт персональные данные, а кэш сохраняет ответ как статику. Это:',
  o:['Web cache poisoning','Web cache deception','Request smuggling','Host header injection'],
  c:1,e:'Deception: в кэш попадает приватный ответ жертвы, и его потом забирает атакующий по тому же URL. При poisoning наоборот — атакующий кладёт свой вредоносный ответ в кэш для всех остальных.'},
 {q:'Сервер динамически отражает <code class="ic">Origin</code> в <code class="ic">Access-Control-Allow-Origin</code>, но не ставит <code class="ic">Vary: Origin</code>. Что произойдёт?',
  o:['Ничего, Vary влияет только на скорость','Кэш сохранит ответ с ACAO одного origin и отдаст его другим клиентам','Браузер отклонит ответ как некорректный','Preflight перестанет кэшироваться'],
  c:1,e:'Без Vary заголовок Origin не входит в ключ кэша, и один сохранённый ответ раздаётся всем. Это уже уязвимость: политика CORS одного клиента применяется к другим.'},
 {q:'Что означает «HTTP stateless»?',
  o:['Сервер не хранит файлы','Каждый запрос обрабатывается независимо, протокол не связывает его с предыдущими','Соединение закрывается после каждого запроса','Ответы нельзя кэшировать'],
  c:1,e:'Именно из этого свойства и растут cookies: состояние добавляется слоем выше. А из того, что браузер прикладывает cookie автоматически ко всякому запросу к домену, растёт CSRF.'},
 {q:'В чём разница между <code class="ic">401</code> и <code class="ic">403</code>?',
  o:['401 — «не знаю, кто ты», 403 — «знаю, но нельзя»','401 — ошибка сервера, 403 — ошибка клиента','401 — временно, 403 — навсегда','Разницы нет, это синонимы'],
  c:0,e:'401 Unauthorized — не пройдена аутентификация. 403 Forbidden — личность известна, но прав недостаточно. Отдельно помни: на чувствительных ресурсах 403 сам по себе подтверждает существование объекта, поэтому иногда правильнее вернуть 404.'}
]},

client:{title:'CLIENT · HTML, JS, браузер',q:[
 {q:'Пользователь загрузил файл <code class="ic">avatar.png</code>, внутри которого HTML со скриптом. Сервер отдаёт его без корректного Content-Type. Какой заголовок предотвратит исполнение?',
  o:['X-Frame-Options: DENY','X-Content-Type-Options: nosniff','Referrer-Policy: no-referrer','Cache-Control: no-store'],
  c:1,e:'Без nosniff браузер может «принюхаться» к содержимому и решить разобрать файл как HTML — получим stored XSS из картинки. nosniff запрещает угадывание и заставляет верить заявленному типу.'},
 {q:'Чем <code class="ic">defer</code> отличается от <code class="ic">async</code>?',
  o:['defer грузит быстрее','defer выполняется после полного разбора документа и сохраняет порядок, async — сразу по готовности и без гарантии порядка','async работает только для inline-скриптов','Разницы нет'],
  c:1,e:'Оба грузятся параллельно парсингу. Но defer ждёт окончания разбора и выполняет скрипты в порядке разметки, а async выполняет сразу по загрузке, прерывая парсинг, и порядок не гарантирует. Ни то, ни другое не работает без атрибута src.'},
 {q:'XSS-payload попал в DOM, но <code class="ic">alert</code> не сработал. Наименее вероятная причина из списка:',
  o:['CSP блокирует inline-исполнение','Payload вставлен через innerHTML, а так вставленные теги script не исполняются','Payload попал в контекст, где не исполняется — например, внутрь textarea','Сервер вернул статус 200 вместо 302'],
  c:3,e:'Статус ответа к исполнению скрипта отношения не имеет. А вот CSP, ограничение innerHTML на теги script, неподходящий контекст вставки и санитайзеры — реальные и частые причины.'},
 {q:'Зачем Chrome разносит разные сайты по разным процессам (Site Isolation)?',
  o:['Чтобы экономить память','Чтобы спекулятивные атаки на процессорный кэш не позволяли читать данные чужого сайта','Чтобы ускорить рендеринг','Чтобы поддерживать больше вкладок'],
  c:1,e:'Site Isolation включили по умолчанию как ответ на Spectre и Meltdown: если чужой сайт исполняется в твоём процессе, через побочные каналы можно вычитать его данные из общей памяти. Памяти при этом расходуется больше — это осознанный размен.'},
 {q:'Какое хранилище браузера умеет быть недоступным для JavaScript?',
  o:['localStorage','sessionStorage','Cookie с флагом HttpOnly','IndexedDB'],
  c:2,e:'Только cookie имеет флаг HttpOnly. У localStorage, sessionStorage и IndexedDB аналога нет: любой скрипт на странице читает их полностью. Отсюда и главный аргумент против хранения токенов в localStorage.'},
 {q:'Почему CSS блокирует отрисовку, а картинки нет?',
  o:['CSS весит больше','Позднее правило CSS может переопределить раннее, поэтому до полной загрузки браузер не знает финальный вид элемента','Картинки грузятся с другого домена','Так требует спецификация HTTP'],
  c:1,e:'HTML можно разбирать и показывать по частям, а CSS — нет: пока таблица стилей не загружена целиком, любой элемент может изменить вид. Под картинки же просто резервируется место.'}
]},

arch:{title:'ARCHITECTURE · рендеринг и API',q:[
 {q:'Кнопка «удалить пользователя» скрыта в интерфейсе для обычных пользователей, но эндпоинт <code class="ic">DELETE /api/users/42</code> отвечает всем. Как называется уязвимость?',
  o:['BOLA (доступ к чужому объекту)','BFLA (доступ к чужой функции)','Mass assignment','Injection'],
  c:1,e:'BFLA — Broken Function Level Authorization: доступ к операции, которая должна быть закрыта по роли. BOLA — это когда через свою же функцию получаешь чужой объект, например чужой заказ по его ID.'},
 {q:'Клиент отправляет <code class="ic">{"name":"Вася","is_admin":true}</code>, и сервер применяет весь объект к модели пользователя. Это:',
  o:['BOLA','Mass assignment','SSRF','Insecure deserialization'],
  c:1,e:'Mass assignment: сервер бездумно присваивает все пришедшие поля, включая те, которые клиент менять не должен. Лечится явным списком разрешённых полей (allowlist), а не попыткой отфильтровать опасные.'},
 {q:'Что означает ограничение «stateless» в REST?',
  o:['Сервер не хранит данные в базе','Сервер не хранит контекст сессии между запросами — всё нужное приходит в самом запросе','Ответы нельзя кэшировать','Клиент не хранит cookies'],
  c:1,e:'Именно поэтому любой узел кластера может обслужить любой запрос, и именно поэтому в REST популярны самодостаточные подписанные токены. Обратная сторона — такой токен нельзя мгновенно отозвать.'},
 {q:'Чем опасна включённая в продакшене GraphQL introspection?',
  o:['Замедляет ответы API','Отдаёт атакующему полную схему API, включая скрытые мутации и поля','Отключает аутентификацию','Ломает кэширование'],
  c:1,e:'Introspection возвращает описание всех типов, полей и мутаций — готовую карту поверхности атаки, включая то, чего нет ни в документации, ни в интерфейсе. Отключение — не защита сама по себе, но убирает бесплатную разведку.'},
 {q:'В микросервисной архитектуре внутренние сервисы не аутентифицируют друг друга: «мы же внутри периметра». Чем это опасно?',
  o:['Ничем, это стандартная практика','Одна SSRF на фронтовом сервисе открывает доступ ко всей внутренней инфраструктуре','Замедляется работа сети','Ломается балансировка нагрузки'],
  c:1,e:'Модель «внутри сети всё доверенное» падает от первой же SSRF: атакующий заставляет доверенный сервис ходить по внутренним адресам. Ответ — zero trust: mTLS или подписанные токены на каждом вызове.'},
 {q:'Какой формат API исторически связан с XXE-атаками?',
  o:['REST на JSON','SOAP на XML','gRPC на protobuf','WebSocket'],
  c:1,e:'SOAP использует XML, а XML-парсеры поддерживают внешние сущности. Если парсер их не отключить — получаем чтение файлов сервера и SSRF. Отдельно SOAP-сервисы часто оставляют открытым WSDL с полным описанием методов.'}
]},

state:{title:'STATE · cookies, сессии, auth',q:[
 {q:'На сайте есть XSS, но сессионная cookie помечена HttpOnly. Возможен ли захват аккаунта?',
  o:['Нет, HttpOnly полностью защищает','Да: скрипт может действовать от имени жертвы, читать CSRF-токен из DOM и менять пароль или почту','Только если нет CSP','Только при SameSite=None'],
  c:1,e:'HttpOnly мешает украсть значение cookie, но не мешает действовать. Браузер сам приложит сессионную cookie к запросам, которые сделает внедрённый скрипт. Плюс кейлоггинг, чтение DOM и фишинговые оверлеи.'},
 {q:'Cookie выставлена на <code class="ic">shop.example.com</code> с атрибутом <code class="ic">Domain=example.com</code>. Кто её получит?',
  o:['Только shop.example.com','example.com и все его поддомены, включая соседние','Только example.com','Никто, браузер отклонит такую cookie'],
  c:1,e:'Атрибут Domain расширяет область на родительский домен и все его поддомены. Без Domain cookie была бы host-only — только на shop.example.com. Ставить на чужой поддомен нельзя, браузер отклонит.'},
 {q:'Какой префикс имени cookie защищает от cookie tossing со скомпрометированного поддомена?',
  o:['__Secure-','__Host-','__Same-','__Strict-'],
  c:1,e:'__Host- требует Secure и Path=/ и запрещает атрибут Domain — cookie намертво привязывается к одному хосту, и поддомен не может её ни прочитать, ни перезаписать. __Secure- требует только флаг Secure и от tossing не спасает.'},
 {q:'В header JWT указано <code class="ic">"alg":"none"</code>. Почему это опасно?',
  o:['Такой токен нельзя декодировать','Если сервер берёт алгоритм из самого токена, подпись можно просто убрать','Токен станет слишком длинным','Браузер откажется его хранить'],
  c:1,e:'Алгоритм проверки должен быть жёстко задан на сервере, а не прочитан из недоверенного токена. Тот же корень у algorithm confusion RS256 в HS256. Ещё хуже — вызов decode вместо verify: подпись не проверяется вообще.'},
 {q:'OAuth 2.0 — это протокол:',
  o:['Аутентификации','Авторизации (делегирования доступа)','Шифрования','Управления сессиями'],
  c:1,e:'OAuth отвечает на вопрос «можно ли приложению получить доступ к этим данным», а не «кто пользователь». Использовать голый access-токен как доказательство личности небезопасно — для аутентификации есть OpenID Connect с проверяемым id_token.'},
 {q:'Зачем в OAuth нужен параметр <code class="ic">state</code>?',
  o:['Чтобы хранить настройки пользователя','Для защиты от CSRF на этапе авторизации','Чтобы указать срок жизни токена','Чтобы выбрать grant type'],
  c:1,e:'Без проверки state атакующий может подсунуть жертве свой authorization code и привязать свой аккаунт к её сессии. Параметр должен быть непредсказуемым и обязательно сверяться при возврате.'},
 {q:'Почему SameSite=Lax не гарантирует защиту от CSRF?',
  o:['Он не поддерживается браузерами','Он пропускает top-level navigation GET, а поддомены считаются same-site','Он работает только по HTTP','Он требует HttpOnly'],
  c:1,e:'Плюс отдельно: у Chrome есть окно около 120 секунд для cross-site POST у cookie, выставленных без явного SameSite; работает трюк с method override; и никакой SameSite не помогает при XSS, потому что запросы скрипта не являются cross-site.'},
 {q:'Salt и pepper при хранении паролей решают:',
  o:['Одну и ту же задачу, pepper — просто длиннее','Разные задачи: salt против радужных таблиц, pepper — против утечки одной только БД','Salt шифрует, pepper хеширует','Ничего, оба устарели'],
  c:1,e:'Salt уникален для каждого пользователя, хранится рядом с хешем и секретом не является. Pepper — глобальный секрет, лежит отдельно от базы (Vault, переменные окружения), чтобы утёкшие хеши без него были бесполезны.'}
]},

browsersec:{title:'BROWSER SECURITY · SOP, CORS, CSP, headers',q:[
 {q:'Что именно блокирует Same-Origin Policy?',
  o:['Отправку запроса на другой origin','Чтение ответа с другого origin из скрипта','Загрузку картинок с других доменов','Отправку формы на чужой домен'],
  c:1,e:'Формула, по которой сразу видно уровень: «запрос уходит, ответ не читается». Cross-origin writes (формы, редиректы) и embedding (script, img, iframe) SOP разрешает. Именно поэтому CSRF работает несмотря на SOP.'},
 {q:'В консоли CORS error, но запись в базе всё-таки создалась. Как это объяснить?',
  o:['Это баг браузера','Запрос долетел до сервера и отработал, браузер лишь не отдал ответ скрипту','Сервер обошёл SOP','Сработал preflight'],
  c:1,e:'CORS — правило браузера, а не сервера. Побочный эффект уже произошёл. Единственное исключение: если запрос требовал preflight и OPTIONS не разрешили, основной запрос действительно не уйдёт.'},
 {q:'Какой запрос НЕ вызовет preflight?',
  o:['POST с Content-Type: application/json','GET с заголовком Authorization','POST с Content-Type: application/x-www-form-urlencoded и без кастомных заголовков','DELETE без тела'],
  c:2,e:'Простыми считаются GET, HEAD и POST с одним из трёх разрешённых Content-Type и без нестандартных заголовков — ровно то, что можно было отправить HTML-формой ещё до появления CORS. Заголовок Authorization в safelist не входит.'},
 {q:'Сервер отражает пришедший Origin в ACAO и ставит <code class="ic">Access-Control-Allow-Credentials: true</code>. Почему это уязвимость?',
  o:['Браузер отклонит такой ответ','Формально это не wildcard, поэтому запрет спецификации не срабатывает — и любой сайт может читать данные залогиненного пользователя','Это сломает preflight','Ничего страшного, если есть HTTPS'],
  c:1,e:'Запрет на сочетание «звёздочка + credentials» обходится отражением конкретного значения. Правильно — сверять со списком строгим равенством и ставить Vary: Origin.'},
 {q:'Политика <code class="ic">script-src &#39;self&#39; &#39;unsafe-inline&#39;</code> защищает от XSS?',
  o:['Да, потому что запрещены чужие домены','Практически нет: unsafe-inline разрешает inline-скрипты и обработчики событий — то, чем и эксплуатируется XSS','Да, если добавить HTTPS','Только от stored XSS'],
  c:1,e:'unsafe-inline убивает основной смысл CSP. Современная рекомендация — nonce или hash плюс strict-dynamic, обязательно с object-src none и base-uri none, иначе остаются обходы через object и подмену base.'},
 {q:'Что делает <code class="ic">&#39;strict-dynamic&#39;</code> в CSP?',
  o:['Запрещает динамическое создание элементов','Даёт скрипту, прошедшему проверку по nonce или hash, право загружать другие скрипты','Включает Report-Only режим','Требует HTTPS для всех ресурсов'],
  c:1,e:'Доверие передаётся по цепочке, а не по списку доменов. Это решает проблему сторонних библиотек, которые сами подгружают код и не могут получить nonce. При наличии strict-dynamic список источников браузером игнорируется.'},
 {q:'Отдаются оба заголовка: <code class="ic">X-Frame-Options: SAMEORIGIN</code> и <code class="ic">CSP: frame-ancestors &#39;none&#39;</code>. Что применит браузер?',
  o:['X-Frame-Options, он старше','frame-ancestors — CSP имеет приоритет','Оба, по логическому И','Ни один, будет ошибка'],
  c:1,e:'При наличии обоих браузер руководствуется frame-ancestors, а X-Frame-Options игнорирует. Второй оставляют только ради очень старых клиентов. И помни: X-Frame-Options в теге meta не работает вообще.'},
 {q:'Чем <code class="ic">Sec-Fetch-Site</code> надёжнее проверки <code class="ic">Referer</code>?',
  o:['Он короче и быстрее парсится','Его проставляет сам браузер и скрипт не может его подделать, и он присутствует всегда','Он шифруется','Он работает только по HTTPS'],
  c:1,e:'Заголовки с префиксом Sec- защищены от установки из JS. Referer же может отсутствовать по политике referrer, и приложения обычно вынуждены трактовать его отсутствие как «пропустить» — что и даёт обход.'}
]}
};

{t:'web',q:'Ключевая дата в истории веба и почему',a:'<b>30 апреля 1993</b> — CERN отдал код веба в public domain, бесплатно и без отчислений. Именно это, а не техническое превосходство, сделало веб победителем среди гипертекстовых систем. Первое предложение — 1989, первый сервер — 1990.'},
{t:'web',q:'Web 3.0 и Web3 — это одно и то же?',a:'Нет. <b>Web 3.0 / Semantic Web</b> — концепция Бернерса-Ли конца 90-х про машиночитаемые данные (RDF, schema.org). <b>Web3</b> — термин Gavin Wood, 2014, про децентрализацию на блокчейне. Общее только созвучие.'},
{t:'web',q:'Почему в вебе так много «костылей» в безопасности?',a:'Обратная совместимость. Веб проектировался в 1989 для обмена документами между доверяющими друг другу учёными: ни аутентификации, ни шифрования, ни разграничения доступа. Всё навешивалось сверху и вводилось как opt-in — поэтому <b>небезопасная конфигурация является конфигурацией по умолчанию</b>.'},

{t:'net',q:'Цепочка DNS-резолвинга',a:'Кэш браузера → кэш ОС (stub resolver) → рекурсивный резолвер → <b>root</b> → <b>TLD</b> (.com) → <b>authoritative</b> сервер зоны → A-запись с TTL. Кэш есть на каждом шаге. Порт 53, базовый RFC 1035.'},
{t:'net',q:'TCP three-way handshake',a:'<b>SYN</b> (клиент: хочу соединиться) → <b>SYN-ACK</b> (сервер: готов) → <b>ACK</b> (клиент: подтверждаю). Три пакета до передачи хоть одного байта данных — плюс ещё круги на TLS. Именно из-за этой цены появились HTTP/2 и HTTP/3.'},
{t:'net',q:'Subdomain takeover — механика',a:'У компании остался CNAME на удалённый внешний сервис. Атакующий регистрирует освободившееся имя у провайдера и получает контроль над поддоменом жертвы: cookies с Domain=example.com, обход SameSite (поддомен = same-site), место в CORS-allowlist, фишинг на легитимном домене.'},
{t:'net',q:'Почему blind-уязвимости детектят по DNS?',a:'Исходящий HTTP часто закрыт, а DNS-запросы почти всегда разрешены. Поэтому SSRF, XXE и blind XSS проверяют, заставив цель зарезолвить подконтрольный домен. Так работает Burp Collaborator.'},

{t:'tls',q:'SSL или TLS — что говорить?',a:'SSL 2.0 и 3.0 сломаны и запрещены. TLS 1.0 и 1.1 отключены в браузерах с 2020. Живых версий две: <b>TLS 1.2 и 1.3</b>. Слово «SSL» осталось в разговорной речи; «SSL-сертификат» и «TLS-сертификат» — одно и то же.'},
{t:'tls',q:'Что даёт TLS — три свойства',a:'<b>Конфиденциальность</b> (трафик зашифрован), <b>целостность</b> (нельзя незаметно изменить), <b>аутентификация сервера</b> (сертификат подтверждает, что это именно тот домен). Третье часто забывают, а без него шифрование бесполезно — можно шифровать канал прямо к атакующему.'},
{t:'tls',q:'Что видно наблюдателю при HTTPS?',a:'Видно: IP назначения, порт, объём и тайминг трафика, <b>имя домена в SNI</b> и в DNS-запросе. Скрыто: путь URL, query, заголовки, cookies, тела запроса и ответа.'},
{t:'tls',q:'Зачем HSTS, если есть редирект на HTTPS?',a:'Редирект приходит в ответ на <b>уже отправленный открытый</b> запрос — его перехватывают и не дают дойти (SSL stripping). HSTS переносит решение в браузер: тот не идёт по HTTP вообще. Дыру первого визита закрывает preload-список.'},
{t:'tls',q:'Forward secrecy',a:'Сеансовые ключи эфемерны и не выводятся из долговременного ключа сервера. Утечка приватного ключа <b>не даёт расшифровать ранее записанный трафик</b>. В TLS 1.3 обязательна.'},

{t:'url',q:'Origin — определение',a:'<b>Схема + хост + порт</b> (RFC 6454). Совпасть должны все три. Поддомен — другой origin. Другой порт — другой origin. Путь, query и fragment в origin не входят.'},
{t:'url',q:'Origin против site',a:'Origin — схема + хост + порт, строгое сравнение, используется в SOP и CORS. Site — схема + eTLD+1, поддомены и порт игнорируются, используется в SameSite. <b>Скомпрометированный поддомен — чужой origin, но свой site</b>: SOP держит, SameSite падает.'},
{t:'url',q:'Что происходит с fragment (после #)?',a:'Не отправляется на сервер вообще, обрабатывается клиентом. Следствия: payload во фрагменте не попадёт в логи и не увидит WAF; OAuth implicit клал туда токен именно поэтому; <code class="ic">location.hash</code> — типовой source для DOM XSS.'},
{t:'url',q:'Public Suffix List — зачем',a:'Список суффиксов, под которыми регистрируются независимые владельцы: com, co.uk, github.io, vercel.app. Браузер по нему вычисляет eTLD+1, чтобы <code class="ic">alice.github.io</code> не мог ставить cookies и считаться same-site с <code class="ic">bob.github.io</code>.'},

{t:'http',q:'Safe против idempotent',a:'<b>Safe</b> — ничего не меняет (GET, HEAD, OPTIONS). <b>Idempotent</b> — меняет, но повтор не добавляет эффекта (PUT, DELETE). Всё safe автоматически idempotent, наоборот — нет. POST не является ни тем, ни другим.'},
{t:'http',q:'Зачем нужен заголовок Host?',a:'На одном IP живут сотни сайтов (virtual hosting): TCP-соединение приводит к машине, Host говорит, чей контент отдавать. В HTTP/1.1 обязателен, без него ответ 400. Отсюда класс атак Host header injection — например, password reset poisoning.'},
{t:'http',q:'Почему GET, меняющий состояние, — плохо?',a:'Спецификация обещает, что GET безопасен, и на это полагаются: префетч браузера, сканеры ссылок, антивирусы могут вызвать действие. Плюс <b>SameSite=Lax не блокирует top-level navigation GET</b>, поэтому CSRF-защита не сработает.'},
{t:'http',q:'Каким заголовкам запроса нельзя доверять?',a:'<b>Всем.</b> Их задаёт клиент. Типовые ошибки: доверие X-Forwarded-For (обход контроля доступа и rate limiting), доверие Host (password reset poisoning, отравление кэша), Referer как защита от CSRF (легко убирается).'},
{t:'http',q:'HTTP stateless — что это значит',a:'Протокол не связывает запросы между собой, каждый самодостаточен. Состояние добавляется слоем выше — cookies. Из того, что браузер прикладывает cookie <b>автоматически</b>, включая запросы с чужих сайтов, и растёт CSRF.'},

{t:'http',q:'Версии HTTP: что дала каждая',a:'<b>1.0</b> — соединение на каждый запрос. <b>1.1</b> — keep-alive, обязательный Host, chunked (здесь живёт smuggling). <b>2</b> — бинарный формат, мультиплексирование, HPACK. <b>3</b> — поверх QUIC/UDP, шифрование встроено в транспорт.'},
{t:'http',q:'Cache poisoning против cache deception',a:'<b>Poisoning</b>: атакующий кладёт свой вредоносный ответ в общий кэш, его получают все — атака на многих. <b>Deception</b>: атакующий заставляет кэш сохранить приватный ответ жертвы и потом забирает его сам — кража у одного.'},
{t:'http',q:'Причина request smuggling в одной фразе',a:'Два парсера (фронтенд и бэкенд) по-разному определяют, где кончается запрос, потому что длину тела можно задать двумя способами: Content-Length и Transfer-Encoding: chunked. Хвост остаётся в буфере и приклеивается к следующему запросу другого пользователя.'},

{t:'browser',q:'Render pipeline браузера',a:'HTML → <b>DOM</b>, CSS → <b>CSSOM</b>, их объединение → <b>Render Tree</b> (только видимое) → <b>Layout</b> (геометрия) → <b>Paint</b> (пиксели) → <b>Composite</b> (сборка слоёв). CSS блокирует рендер, потому что позднее правило может переопределить раннее.'},
{t:'browser',q:'script, async, defer',a:'Обычный <code class="ic">script src</code> — блокирует парсинг, исполняется сразу. <code class="ic">async</code> — грузится параллельно, исполняется по готовности, порядок не гарантирован. <code class="ic">defer</code> — грузится параллельно, исполняется после разбора документа, порядок сохранён. На inline-скрипты оба атрибута не действуют.'},
{t:'browser',q:'Source и sink',a:'<b>Source</b> — откуда приходят управляемые пользователем данные: location.hash, document.referrer, postMessage, поля формы. <b>Sink</b> — где они становятся кодом: innerHTML, document.write, eval, setTimeout со строкой. Путь от source к sink без экранирования = DOM-based XSS.'},
{t:'browser',q:'Зачем браузеру много процессов',a:'Изоляция. Renderer исполняет недоверенный код в <b>sandbox</b> без прав в ОС — чтобы баг в движке не давал сразу доступ к машине. <b>Site Isolation</b> разносит разные сайты по процессам как ответ на Spectre: нельзя вычитать из памяти то, чего там нет.'},
{t:'browser',q:'Cookie против localStorage',a:'Cookie: может быть HttpOnly (защита от кражи при XSS), но отправляется автоматически — отсюда CSRF. localStorage: аналога HttpOnly нет вовсе (любой скрипт читает всё), но сам не отправляется — CSRF неприменим. <b>Cookie уязвима к CSRF и защитима от XSS, localStorage — наоборот.</b>'},

{t:'arch',q:'Что изменил AJAX для безопасности',a:'Сервер стал отдавать данные вместо разметки → появились API. Поверхность атаки теперь = набор эндпоинтов, а он гораздо шире того, что видно в интерфейсе. <b>Скрыть кнопку в UI не значит закрыть доступ.</b>'},
{t:'arch',q:'Шесть ограничений REST',a:'Client-server, <b>stateless</b>, cache, uniform interface, layered system, code-on-demand (необязательное). Рой Филдинг, диссертация 2000 года, глава 5.'},
{t:'arch',q:'BOLA против BFLA',a:'<b>BOLA</b> — доступ к чужому объекту через свою же функцию (GET /orders/1043 — чужой заказ). Это IDOR. <b>BFLA</b> — доступ к чужой функции (обычный юзер вызывает DELETE /admin/users/42). Первое про объект, второе про операцию.'},
{t:'arch',q:'Чем опасна GraphQL introspection в проде',a:'Отдаёт полную схему API: все типы, поля, мутации, аргументы — включая то, чего нет в документации и в интерфейсе. Готовая карта поверхности атаки. Отключение не защита сама по себе, но убирает бесплатную разведку.'},

{t:'state',q:'Атрибуты cookie и что каждый даёт',a:'<b>HttpOnly</b> — JS не читает (защита от кражи при XSS, не от XSS). <b>Secure</b> — только по HTTPS. <b>SameSite</b> Strict/Lax/None — против CSRF. <b>Domain</b> — расширяет на поддомены. <b>Path</b> — по пути (не защита). <b>Partitioned</b> — изоляция по top-level сайту.'},
{t:'state',q:'Правило выставления cookie по Domain',a:'Cookie можно поставить <b>на себя или на родительский домен</b>, но не на чужой поддомен и не на чужой домен. Без атрибута Domain cookie host-only. С Domain=example.com — видна на домене и всех поддоменах.'},
{t:'state',q:'__Host- префикс — что даёт',a:'Требует Secure и Path=/, <b>запрещает атрибут Domain</b>. Cookie намертво привязана к одному хосту: поддомен не может её ни прочитать, ни перезаписать. Единственная защита от cookie tossing. __Secure- слабее — требует только Secure.'},
{t:'state',q:'Где SameSite не спасает — пять случаев',a:'(1) поддомены — это same-site; (2) GET, меняющий состояние, при Lax проходит; (3) окно ~120 секунд для cross-site POST у cookie без явного SameSite в Chrome; (4) method override заголовки; (5) <b>XSS — запросы скрипта не cross-site вообще</b>.'},
{t:'state',q:'Сессия на сервере против токена',a:'<b>Серверная</b>: в cookie только ID, данные на сервере. Мгновенный отзыв, но нужно общее хранилище. <b>Токен</b>: подписан, самодостаточен, без похода в хранилище. Масштабируется, но <b>нельзя отозвать до истечения срока</b>.'},
{t:'state',q:'Session fixation — механика и защита',a:'Атакующий навязывает жертве заранее известный ему идентификатор сессии, жертва логинится — и сессия становится авторизованной. Защита: <b>выдавать новый ID после успешной аутентификации</b> и при смене привилегий.'},

{t:'auth',q:'Identification, authentication, authorization',a:'<b>Identification</b> — заявление о личности без доказательства. <b>Authentication</b> — доказательство (кто ты). <b>Authorization</b> — проверка прав после подтверждения личности (что тебе можно). Основная масса уязвимостей — на третьем шаге.'},
{t:'auth',q:'Как хранить пароли',a:'Медленная хеш-функция с требованием к памяти: <b>Argon2id</b> (OWASP: 19 МиБ, 2 итерации, параллелизм 1), альтернативы scrypt и bcrypt (work factor ≥ 10). <b>Salt</b> — уникальный на пользователя, рядом с хешем, не секрет. <b>Pepper</b> — глобальный секрет, хранится отдельно от БД.'},
{t:'auth',q:'Структура JWT',a:'<code class="ic">header.payload.signature</code>, каждая часть Base64URL. Header — алгоритм. Payload — claims (sub, exp, iss, aud, jti). Signature — подпись двух первых частей. <b>Payload не зашифрован</b> — подпись защищает от изменения, но не от чтения.'},
{t:'auth',q:'Классические промахи с JWT',a:'decode вместо verify (подпись не проверяется вовсе), alg:none, algorithm confusion RS256→HS256 (публичный ключ как HMAC-секрет), общий HS256-секрет на десятки сервисов, отсутствие проверки exp/aud/iss.'},
{t:'auth',q:'Как сделать logout при stateless JWT',a:'Полностью отозвать подписанный токен нельзя. Рабочие подходы: короткий TTL access-токена (5-15 мин) + отзываемый refresh; блоклист по jti до истечения; версия токена в профиле, инкрементируемая при выходе. <b>Полный stateless и мгновенный отзыв несовместимы.</b>'},
{t:'auth',q:'OAuth — это аутентификация?',a:'<b>Нет</b>, это авторизация (делегирование доступа). Access-токен говорит о правах, а не о личности; принимать его как доказательство личности небезопасно (token substitution). Для аутентификации есть <b>OpenID Connect</b>: id_token с проверяемыми iss, aud, sub, nonce.'},
{t:'auth',q:'Где ломают OAuth',a:'Слабая валидация redirect_uri (сверка по префиксу вместо точного совпадения) → код улетает атакующему. Отсутствие проверки state → CSRF на этапе авторизации. Перехват кода у публичного клиента → лечится PKCE.'},
{t:'auth',q:'Access + refresh — правильная схема',a:'Access: 5-15 минут, HttpOnly + Secure + SameSite cookie. Refresh: дни, HttpOnly + Secure + SameSite=Strict, <b>узкий Path</b>, одноразовый (rotating). Повторное использование погашенного refresh — признак кражи: гасим всю цепочку и требуем повторный вход.'},

{t:'sop',q:'Что блокирует Same-Origin Policy',a:'<b>Чтение</b> ответа и данных другого origin из скрипта. Не блокирует: отправку запроса, отправку формы, переход, встраивание через script/img/iframe/link. Формула: <b>запрос уходит, ответ не читается</b>.'},
{t:'sop',q:'Почему CSRF возможен при наличии SOP',a:'CSRF не требует чтения ответа — нужен побочный эффект на сервере. Cross-origin writes SOP разрешает, браузер приложит cookies. От CSRF защищают SameSite, CSRF-токены и проверка Origin на сервере, а не SOP.'},
{t:'sop',q:'Почему XSS обходит все клиентские защиты',a:'Скрипт исполняется <b>внутри целевого origin</b> — для браузера это родной код страницы. Границу пересекать не нужно. Поэтому SameSite неприменим (запросы не cross-site), CSRF-токен читается из DOM, а HttpOnly спасает лишь от кражи значения cookie.'},
{t:'sop',q:'postMessage — две типовые ошибки',a:'При отправке — <code class="ic">targetOrigin: &#39;*&#39;</code> (сообщение уйдёт кому угодно после редиректа). При приёме — не проверяется <code class="ic">event.origin</code>. Отдельно: проверка через indexOf вместо строгого равенства пропустит <code class="ic">example.com.evil.com</code>.'},

{t:'cors',q:'CORS — что это на самом деле',a:'Механизм <b>контролируемого ослабления</b> SOP, а не защита. Сервер заголовками говорит браузеру, кому можно читать его ответы. Проверку выполняет браузер — curl, Postman и любой бэкенд её игнорируют.'},
{t:'cors',q:'Когда preflight не нужен',a:'Простой запрос: метод GET/HEAD/POST + Content-Type только form-urlencoded, multipart/form-data или text/plain + только safelisted-заголовки. Логика: <b>это то, что можно было отправить HTML-формой ещё до появления CORS</b>.'},
{t:'cors',q:'Почему ACAO: * несовместим с credentials',a:'«Звёздочка» = любому сайту, credentials = с cookies пользователя. Вместе это дало бы любому сайту право читать твои данные с любого сервиса, где ты залогинен — то есть полную отмену SOP. Браузер такой ответ отвергает.'},
{t:'cors',q:'Главный мисконфиг CORS',a:'<b>Отражение Origin</b>: сервер копирует пришедший Origin в ACAO плюс ставит credentials: true. Формально не wildcard, поэтому запрет спецификации не срабатывает — а по факту читать может любой домен. Правильно: allowlist со строгим равенством + Vary: Origin.'},
{t:'cors',q:'В консоли CORS error, но запись создалась',a:'Нормальное поведение. Запрос долетел и отработал, браузер лишь не отдал ответ скрипту. Исключение — если требовался preflight и OPTIONS не разрешили: тогда основной запрос не уходит.'},

{t:'csp',q:'Что делает CSP',a:'Определяет, <b>какие ресурсы страница имеет право загружать и исполнять</b>. Второй рубеж против XSS: не заменяет экранирование, но снижает последствия. Задаётся заголовком; через meta не работают frame-ancestors, report-uri и sandbox.'},
{t:'csp',q:'Nonce против hash',a:'<b>Nonce</b> — случайное значение на каждый ответ, требует динамики на сервере, годится для меняющегося inline. <b>Hash</b> — отпечаток конкретного содержимого, годится для неизменного inline и статики. Nonce обязан быть новым при каждом запросе, иначе он декоративный.'},
{t:'csp',q:'strict-dynamic — что решает',a:'Скрипт, прошедший проверку по nonce или hash, получает право загружать другие скрипты. Доверие передаётся <b>по цепочке</b>, а не по списку доменов — решает проблему сторонних библиотек, которые сами подгружают код.'},
{t:'csp',q:'Чем убивают собственную CSP',a:'unsafe-inline (разрешает ровно то, чем эксплуатируется XSS), unsafe-eval, статический nonce, wildcard в script-src, JSONP на разрешённом домене, забытые base-uri и object-src (обходы, которые script-src не закрывает).'},

{t:'headers',q:'Referrer-Policy — зачем',a:'Ограничивает данные в заголовке Referer. Полный URL часто содержит токены сброса пароля, идентификаторы и приватные пути — всё это утекало бы третьей стороне. Дефолт современных браузеров: <code class="ic">strict-origin-when-cross-origin</code>.'},
{t:'headers',q:'X-XSS-Protection — что с ним',a:'<b>Устарел и нестандартен.</b> Старый встроенный фильтр отражённого XSS, который сам мог создавать уязвимости. Правильно — не ставить вовсе или ставить значение 0. Рекомендация «1; mode=block» означает устаревший чек-лист.'},

{t:'headers',q:'Fetch Metadata — чем лучше Referer',a:'Заголовки Sec-Fetch-Site/Mode/Dest/User проставляет <b>сам браузер</b>, JS их подделать не может, и они присутствуют всегда. Простое правило: отклонять запросы с <code class="ic">Sec-Fetch-Site: cross-site</code>, у которых Mode не navigate — это отсекает CSRF и часть XS-Leaks.'},
{t:'headers',q:'Subresource Integrity — что и где',a:'Атрибут <code class="ic">integrity</code> с хешем: браузер сверяет содержимое стороннего файла перед исполнением. Защита от компрометации CDN. Работает только для <b>неизменяемых</b> версионированных файлов; нужен атрибут crossorigin.'},

{t:'owasp',q:'OWASP Top 10:2025 — что нового',a:'A01 Broken Access Control (сюда переехал SSRF), A02 Security Misconfiguration, <b>A03 Software Supply Chain Failures</b> (расширена), A04 Cryptographic Failures, A05 Injection, A06 Insecure Design, A07 Authentication Failures, A08 Integrity Failures, A09 Logging &amp; Alerting, <b>A10 Mishandling of Exceptional Conditions</b> (новая).'},

/* ===== LAB HELPERS ===== */
/* Общие движки для лаб. Все onclick-атрибуты генерируются с &quot; внутри,
   чтобы не ломать строки при сборке. */

const LABSTATE={};

function labEsc(s){return String(s);}

/* --- STEP LAB: пошаговое проигрывание --- */
function mkStepLab(elId,ns,steps,opts){
  const el=document.getElementById(elId);if(!el)return;
  opts=opts||{};
  LABSTATE[ns]={cur:-1,timer:null,steps:steps};
  function render(){
    const st=LABSTATE[ns];
    let h='<div style="display:flex;flex-direction:column;gap:7px">';
    steps.forEach(function(s,i){
      const on=i===st.cur, past=i<st.cur;
      const col=s.c||'#38bdf8';
      h+='<div tabindex="0" role="button" aria-label="'+s.t+'" onclick="window._'+ns+'Sel('+i+')"'
        +' onkeydown="if(event.key===&quot;Enter&quot;||event.key===&quot; &quot;){event.preventDefault();window._'+ns+'Sel('+i+')}"'
        +' style="border:1px solid '+(on?col:'rgba(56,189,248,.15)')+';border-left:3px solid '+(on||past?col:'rgba(56,189,248,.15)')
        +';border-radius:8px;padding:'+(on?'12px 14px':'8px 14px')+';cursor:pointer;background:'+(on?'rgba(56,189,248,.06)':'#0f1620')
        +';transition:.16s;opacity:'+(past||on?'1':'.55')+'">'
        +'<div style="display:flex;align-items:center;gap:10px">'
        +'<span style="font-size:10px;color:'+col+';border:1px solid '+col+';border-radius:10px;padding:1px 7px;flex-shrink:0">'+s.n+'</span>'
        +'<span style="font-size:13px;color:'+(on?'#cdd9e5':'#7d8ea3')+';font-weight:'+(on?'600':'400')+'">'+s.t+'</span></div>';
      if(on){
        h+='<div style="font-size:12px;color:#7d8ea3;line-height:1.7;margin-top:9px">'+s.d+'</div>';
        if(s.code)h+='<div class="code" style="margin:10px 0 0;font-size:11.5px">'+s.code+'</div>';
        if(s.sec)h+='<div style="margin-top:10px;padding:9px 11px;background:rgba(255,83,112,.07);border-left:2px solid #ff5370;border-radius:0 6px 6px 0;font-size:11.5px;color:#7d8ea3;line-height:1.65"><span style="color:#ff5370">SEC ▸ </span>'+s.sec+'</div>';
      }
      h+='</div>';
    });
    h+='</div><div class="btn-row" style="margin-top:14px">'
      +'<button class="btn sm gh" onclick="window._'+ns+'Step(-1)">◀ назад</button>'
      +'<button class="btn sm" onclick="window._'+ns+'Step(1)">шаг ▸</button>'
      +'<button class="btn sm gh" onclick="window._'+ns+'Play()">▶ проиграть</button>'
      +'<button class="btn sm gh" onclick="window._'+ns+'Reset()">↻ сброс</button>'
      +'<span style="margin-left:auto;font-size:11px;color:#4a5a6e">'+(st.cur<0?'0':(st.cur+1))+' / '+steps.length+'</span></div>';
    el.innerHTML=h;
  }
  window['_'+ns+'Sel']=function(i){i=Number(i);if(!(i>=0&&i<steps.length))return;LABSTATE[ns].cur=i;render();};
  window['_'+ns+'Step']=function(d){
    const st=LABSTATE[ns];
    st.cur=Math.max(0,Math.min(steps.length-1,st.cur+(Number(d)||0)));render();};
  window['_'+ns+'Reset']=function(){
    const st=LABSTATE[ns];
    if(st.timer){clearInterval(st.timer);st.timer=null;}
    st.cur=-1;render();};
  window['_'+ns+'Play']=function(){
    const st=LABSTATE[ns];
    if(st.timer){clearInterval(st.timer);st.timer=null;return;}
    st.cur=-1;render();
    st.timer=setInterval(function(){
      if(st.cur>=steps.length-1){clearInterval(st.timer);st.timer=null;return;}
      st.cur++;render();
    },1400);};
  render();
}

/* --- SELECT LAB: плитки + панель детали --- */
function mkSelLab(elId,ns,items,opts){
  const el=document.getElementById(elId);if(!el)return;
  opts=opts||{};
  LABSTATE[ns]={cur:opts.start===undefined?0:opts.start,items:items};
  function render(){
    const st=LABSTATE[ns];
    let h=opts.head||'';
    h+='<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">';
    items.forEach(function(it,i){
      const on=i===st.cur,col=it.c||'#38bdf8';
      h+='<button class="btn sm" style="border-color:'+(on?col:'rgba(56,189,248,.25)')+';color:'+(on?'#04121b':col)
        +';background:'+(on?col:'transparent')+'" onclick="window._'+ns+'Pick('+i+')">'+it.k+'</button>';
    });
    h+='</div>';
    const it=items[st.cur];
    if(it){
      const col=it.c||'#38bdf8';
      h+='<div style="border:1px solid rgba(56,189,248,.2);border-left:3px solid '+col+';border-radius:0 9px 9px 0;padding:14px 16px;background:#0c111a">'
        +'<div style="font-size:14px;color:'+col+';font-weight:600;margin-bottom:8px">'+it.t+'</div>'
        +'<div style="font-size:12.5px;color:#7d8ea3;line-height:1.75">'+it.d+'</div>';
      if(it.code)h+='<div class="code" style="margin:12px 0 0;font-size:11.5px">'+it.code+'</div>';
      if(it.sec)h+='<div style="margin-top:12px;padding:10px 12px;background:rgba(255,83,112,.07);border-left:2px solid #ff5370;border-radius:0 6px 6px 0;font-size:11.5px;color:#7d8ea3;line-height:1.7"><span style="color:#ff5370">SEC ▸ </span>'+it.sec+'</div>';
      h+='</div>';
    }
    el.innerHTML=h;
  }
  window['_'+ns+'Pick']=function(i){i=Number(i);if(!(i>=0&&i<items.length))return;LABSTATE[ns].cur=i;render();};
  render();
}

/* --- TOGGLE LAB: набор флагов + вывод --- */
function mkToggleLab(elId,ns,flags,renderOut){
  const el=document.getElementById(elId);if(!el)return;
  const state={};
  flags.forEach(function(f){state[f.id]=!!f.on;});
  LABSTATE[ns]={flags:state};
  function render(){
    const st=LABSTATE[ns].flags;
    let h='<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">';
    flags.forEach(function(f){
      const on=st[f.id],col=f.c||'#00e676';
      h+='<button class="btn sm" style="border-color:'+(on?col:'rgba(125,142,163,.3)')+';color:'+(on?'#04121b':'#7d8ea3')
        +';background:'+(on?col:'transparent')+'" onclick="window._'+ns+'T(&quot;'+f.id+'&quot;)">'
        +(on?'✓ ':'○ ')+f.k+'</button>';
    });
    h+='</div>'+renderOut(st);
    el.innerHTML=h;
  }
  window['_'+ns+'T']=function(id){
    if(!(id in LABSTATE[ns].flags))return;
    LABSTATE[ns].flags[id]=!LABSTATE[ns].flags[id];render();};
  render();
}

    {n:'4',t:'Вычисление ключей',c:'#c792ea',
     d:'Обе стороны независимо вычисляют один и тот же общий секрет из обменянных параметров. Наблюдатель, видевший весь обмен, вычислить его не может. Ключи эфемерны — это и есть forward secrecy.',
     sec:'Утечка приватного ключа сервера не даёт расшифровать ранее записанный трафик, потому что сеансовые ключи из него не выводятся. Модель угрозы: «записать сейчас, расшифровать потом».'},
    {n:'5',t:'Finished + данные',c:'#ff6ac1',

  ]);

/* ===== LAB: m05 HTTP builder ===== */
function buildHttpLab(){
  const el=document.getElementById('httpLab');if(!el)return;
  const M=[
    {k:'GET',c:'#38bdf8',
     req:'<span class="fn">GET</span> /api/orders/42 HTTP/1.1\nHost: shop.example.com\nCookie: sid=a3f9c1\nAccept: application/json\nUser-Agent: Mozilla/5.0\n<span class="cmt">(тела нет)</span>',
     res:'HTTP/1.1 <span class="op">200</span> OK\nContent-Type: application/json\nCache-Control: private, no-store\n\n{"id":42,"total":1990,"status":"paid"}',
     n:'Читаем ресурс. Тела нет, все параметры — в URL. Safe и idempotent, кэшируется.',
     s:'Параметры видны в логах, в истории и в Referer — секретам тут не место. И помни: <b>GET, меняющий состояние, не блокируется SameSite=Lax</b>.'},
    {k:'POST',c:'#00e676',
     req:'<span class="fn">POST</span> /api/orders HTTP/1.1\nHost: shop.example.com\nCookie: sid=a3f9c1\n<span class="op">Content-Type: application/json</span>\nContent-Length: 38\n\n{"item_id":7,"qty":2,"promo":"NEW"}',
     res:'HTTP/1.1 <span class="op">201</span> Created\nLocation: /api/orders/43\nContent-Type: application/json\n\n{"id":43,"status":"pending"}',
     n:'Создаём ресурс. Данные в теле. Ни safe, ни idempotent — повтор создаст второй заказ.',
     s:'Не-idempotent значит, что гонка запросов даёт двойное списание. Отсюда требование идемпотентных ключей в платежах. <code class="ic">Content-Type: application/json</code> требует preflight при cross-origin — а вот form-urlencoded не требует, поэтому именно он используется в CSRF.'},
    {k:'PUT',c:'#ffb020',
     req:'<span class="fn">PUT</span> /api/orders/42 HTTP/1.1\nHost: shop.example.com\nAuthorization: Bearer eyJhbGci...\nContent-Type: application/json\n\n{"item_id":7,"qty":5,"status":"paid"}',
     res:'HTTP/1.1 <span class="op">200</span> OK\nContent-Type: application/json\n\n{"id":42,"qty":5,"status":"paid"}',
     n:'Заменяем ресурс целиком. Idempotent: сколько раз ни повтори — результат один.',
     s:'Проверь, не даёт ли PUT переписать поля, которые клиент менять не должен (<code class="ic">status</code>, <code class="ic">owner_id</code>, <code class="ic">price</code>) — это mass assignment. И отдельно: есть ли вообще проверка, что заказ 42 принадлежит тебе.'},
    {k:'DELETE',c:'#ff5370',
     req:'<span class="fn">DELETE</span> /api/orders/42 HTTP/1.1\nHost: shop.example.com\nAuthorization: Bearer eyJhbGci...',
     res:'HTTP/1.1 <span class="op">204</span> No Content\n<span class="cmt">(тела нет)</span>',
     n:'Удаляем. Idempotent: повторное удаление ничего не меняет.',
     s:'Классическое место для BFLA: эндпоинт закрыт только в интерфейсе, а в API проверки роли нет. Пробуй вызывать напрямую из-под обычного пользователя.'},
    {k:'OPTIONS',c:'#ff6ac1',
     req:'<span class="fn">OPTIONS</span> /api/orders/42 HTTP/1.1\nHost: shop.example.com\n<span class="op">Origin: https://app.example.com</span>\n<span class="op">Access-Control-Request-Method: DELETE</span>\nAccess-Control-Request-Headers: authorization',
     res:'HTTP/1.1 <span class="op">204</span> No Content\nAccess-Control-Allow-Origin: https://app.example.com\nAccess-Control-Allow-Methods: GET, POST, DELETE\nAccess-Control-Allow-Headers: authorization\nAccess-Control-Max-Age: 600\nVary: Origin',
     n:'Спрашиваем, что разрешено. Это и есть CORS preflight — браузер шлёт его сам перед «непростым» запросом.',
     s:'Самый информативный запрос при разведке: показывает разрешённые методы и политику CORS. Если в ответе отражается любой присланный Origin вместе с <code class="ic">Allow-Credentials: true</code> — это находка.'}
  ];
  let cur=0;
  function render(){
    const m=M[cur];
    let h='<div style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px">';
    M.forEach(function(x,i){
      const on=i===cur;
      h+='<button class="btn sm" style="border-color:'+(on?x.c:'rgba(56,189,248,.25)')+';color:'+(on?'#04121b':x.c)
        +';background:'+(on?x.c:'transparent')+'" onclick="window._httpPick('+i+')">'+x.k+'</button>';
    });
    h+='</div><div style="font-size:12.5px;color:#7d8ea3;line-height:1.7;margin-bottom:12px">'+m.n+'</div>'
      +'<div class="grid2" style="gap:10px">'
      +'<div class="code" style="margin:0"><span class="code-label">запрос</span>'+m.req+'</div>'
      +'<div class="code" style="margin:0"><span class="code-label">ответ</span>'+m.res+'</div></div>'
      +'<div style="margin-top:12px;padding:10px 12px;background:rgba(255,83,112,.07);border-left:2px solid #ff5370;border-radius:0 6px 6px 0;font-size:11.5px;color:#7d8ea3;line-height:1.7">'
      +'<span style="color:#ff5370">SEC ▸ </span>'+m.s+'</div>';
    el.innerHTML=h;
  }
  window._httpPick=function(i){i=Number(i);if(!(i>=0&&i<M.length))return;cur=i;render();};
  render();
}

     sec:'Золотая жила при тестировании. Стектрейс в ответе выдаёт версии, пути на диске, имена таблиц и внутренние адреса. Разница между <code class="ic">500</code> и <code class="ic">200</code> при разных входных данных — канал для слепых инъекций. И отдельно A10:2025 — неверная обработка краевых состояний: падение с fail-open вместо fail-closed.'}
  ]);

/* ===== LAB: m11 cookie flags ===== */
function buildCookieLab(){
  mkToggleLab('cookieLab','ck',[
    {id:'httponly',k:'HttpOnly',c:'#00e676',on:false},
    {id:'secure',k:'Secure',c:'#38bdf8',on:false},
    {id:'lax',k:'SameSite=Lax',c:'#ffb020',on:false},
    {id:'strict',k:'SameSite=Strict',c:'#ff5370',on:false},
    {id:'host',k:'__Host- префикс',c:'#c792ea',on:false},
    {id:'domain',k:'Domain=example.com',c:'#ff6ac1',on:false}
  ],function(st){
    const name=st.host?'__Host-sid':'sid';
    let parts=[name+'=a3f9c1b0'];
    if(st.host){parts.push('Secure');parts.push('Path=/');}
    else{
      if(st.secure)parts.push('Secure');
      if(st.domain)parts.push('Domain=example.com');
      parts.push('Path=/');
    }
    if(st.strict)parts.push('SameSite=Strict');
    else if(st.lax)parts.push('SameSite=Lax');
    if(st.httponly)parts.push('HttpOnly');
    const hdr='<span class="fn">Set-Cookie</span>: '+parts.join('; ');

    const rows=[];
    rows.push(['Кража через XSS (document.cookie)',
      st.httponly?['gs','защищено']:['rd','УЯЗВИМО'],
      st.httponly?'JS не видит cookie. Но XSS всё ещё может действовать от имени жертвы.':'Скрипт читает document.cookie и отправляет значение атакующему.']);
    rows.push(['Перехват по открытому HTTP',
      (st.secure||st.host)?['gs','защищено']:['rd','УЯЗВИМО'],
      (st.secure||st.host)?'Cookie уходит только по HTTPS.':'Любой случайный HTTP-запрос на домен утащит cookie в открытом виде.']);
    rows.push(['CSRF через cross-site POST',
      (st.strict||st.lax)?['gs','защищено']:['am','по умолчанию Lax'],
      (st.strict||st.lax)?'Cookie не уйдёт в cross-site POST.':'Явного SameSite нет. Chrome применит Lax по умолчанию, но останется окно ~120 секунд после установки cookie, когда cross-site POST пройдёт.']);
    rows.push(['CSRF через ссылку (top-level GET)',
      st.strict?['gs','защищено']:['rd','УЯЗВИМО'],
      st.strict?'Strict не отправляет cookie даже при переходе по ссылке — но ломает UX перехода из писем и поиска.':'Lax пропускает top-level navigation GET. Если есть эндпоинт вида GET /transfer?to=X — он отработает.']);
    rows.push(['Cookie tossing со скомпрометированного поддомена',
      st.host?['gs','защищено']:['rd','УЯЗВИМО'],
      st.host?'__Host- запрещает атрибут Domain и привязывает cookie к одному хосту — поддомен не перезапишет.':'Поддомен может выставить свою cookie с Domain=example.com и подменить сессию на главном домене.']);
    rows.push(['Чтение cookie с соседнего поддомена',
      (st.host||!st.domain)?['gs','ограничено']:['am','доступна всем поддоменам'],
      (st.host||!st.domain)?'Cookie host-only: видна только на выдавшем хосте.':'С Domain=example.com cookie доступна на всех поддоменах, включая уязвимые.']);

    let h='<div class="code" style="margin:0 0 14px">'+hdr+'</div>';
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    rows.forEach(function(r){
      const cls=r[1][0],lbl=r[1][1];
      const col=cls==='gs'?'#00e676':(cls==='am'?'#ffb020':'#ff5370');
      h+='<div style="border:1px solid rgba(56,189,248,.14);border-left:3px solid '+col+';border-radius:0 7px 7px 0;padding:9px 12px;background:#0c111a">'
        +'<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'
        +'<span style="font-size:12.5px;color:#cdd9e5">'+r[0]+'</span>'
        +'<span style="margin-left:auto;font-size:10px;letter-spacing:1px;color:'+col+'">'+lbl+'</span></div>'
        +'<div style="font-size:11.5px;color:#7d8ea3;line-height:1.6;margin-top:4px">'+r[2]+'</div></div>';
    });
    h+='</div>';
    h+='<div style="margin-top:12px;padding:10px 12px;background:rgba(199,146,234,.07);border-left:2px solid #c792ea;border-radius:0 6px 6px 0;font-size:11.5px;color:#7d8ea3;line-height:1.7">'
      +'<span style="color:#c792ea">ЦЕЛЬ ▸ </span>эталон для сессионной cookie: <code class="ic">__Host-</code> + <code class="ic">HttpOnly</code> + <code class="ic">Secure</code> + <code class="ic">SameSite</code>. '
      +'И помни: <b>никакая комбинация флагов не защищает от XSS</b> — скрипт исполняется в том же origin, и его запросы не являются cross-site.</div>';
    return h;
  });
}

/* ===== LAB: m14 preflight decision ===== */
function buildCorsLab(){
  const el=document.getElementById('corsLab');if(!el)return;
  const S={method:'GET',ctype:'form',extra:false};
  const METHODS=['GET','POST','PUT','DELETE'];
  const CTYPES=[{id:'form',k:'form-urlencoded'},{id:'multipart',k:'multipart/form-data'},{id:'text',k:'text/plain'},{id:'json',k:'application/json'}];
  function decide(){
    const reasons=[];
    if(METHODS.indexOf(S.method)>=0&&['GET','POST'].indexOf(S.method)<0)reasons.push('метод <b>'+S.method+'</b> не входит в GET / HEAD / POST');
    if(S.ctype==='json')reasons.push('<b>Content-Type: application/json</b> не входит в разрешённые три типа');
    if(S.extra)reasons.push('заголовок <b>X-Custom-Token</b> не входит в CORS-safelisted request headers');
    return reasons;
  }
  function render(){
    let h='<div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:14px">';
    h+='<div><div style="font-size:10px;letter-spacing:1.5px;color:#4a5a6e;margin-bottom:6px">МЕТОД</div><div style="display:flex;gap:5px;flex-wrap:wrap">';
    METHODS.forEach(function(m){
      const on=S.method===m;
      h+='<button class="btn sm" style="border-color:'+(on?'#38bdf8':'rgba(56,189,248,.25)')+';color:'+(on?'#04121b':'#38bdf8')
        +';background:'+(on?'#38bdf8':'transparent')+'" onclick="window._corsM(&quot;'+m+'&quot;)">'+m+'</button>';
    });
    h+='</div></div>';
    h+='<div><div style="font-size:10px;letter-spacing:1.5px;color:#4a5a6e;margin-bottom:6px">CONTENT-TYPE</div><div style="display:flex;gap:5px;flex-wrap:wrap">';
    CTYPES.forEach(function(c){
      const on=S.ctype===c.id;
      h+='<button class="btn sm" style="border-color:'+(on?'#c792ea':'rgba(199,146,234,.25)')+';color:'+(on?'#04121b':'#c792ea')
        +';background:'+(on?'#c792ea':'transparent')+'" onclick="window._corsC(&quot;'+c.id+'&quot;)">'+c.k+'</button>';
    });
    h+='</div></div>';
    h+='<div><div style="font-size:10px;letter-spacing:1.5px;color:#4a5a6e;margin-bottom:6px">КАСТОМНЫЙ ЗАГОЛОВОК</div>';
    h+='<button class="btn sm" style="border-color:'+(S.extra?'#ffb020':'rgba(255,176,32,.25)')+';color:'+(S.extra?'#04121b':'#ffb020')
      +';background:'+(S.extra?'#ffb020':'transparent')+'" onclick="window._corsX()">'+(S.extra?'✓ ':'○ ')+'X-Custom-Token</button></div>';
    h+='</div>';

    const reasons=decide();
    const pre=reasons.length>0;
    const ct=S.ctype==='json'?'application/json':(S.ctype==='multipart'?'multipart/form-data':(S.ctype==='text'?'text/plain':'application/x-www-form-urlencoded'));
    let req='<span class="fn">'+S.method+'</span> /api/data HTTP/1.1\nHost: api.example.com\n<span class="op">Origin: https://app.example.com</span>\nContent-Type: '+ct;
    if(S.extra)req+='\n<span class="op">X-Custom-Token: abc123</span>';

    h+='<div style="border:1px solid '+(pre?'rgba(255,176,32,.4)':'rgba(0,230,118,.4)')+';border-radius:9px;padding:13px 15px;background:#0c111a;margin-bottom:12px">'
      +'<div style="font-size:13px;font-weight:600;color:'+(pre?'#ffb020':'#00e676')+';margin-bottom:7px">'
      +(pre?'▶ БУДЕТ PREFLIGHT (OPTIONS перед основным запросом)':'▶ SIMPLE REQUEST — preflight не нужен')+'</div>';
    if(pre){
      h+='<div style="font-size:12px;color:#7d8ea3;line-height:1.7">Причины:<br>';
      reasons.forEach(function(r){h+='· '+r+'<br>';});
      h+='</div>';
    }else{
      h+='<div style="font-size:12px;color:#7d8ea3;line-height:1.7">Метод из GET / HEAD / POST, разрешённый Content-Type, только safelisted-заголовки. '
        +'Такой запрос можно было отправить HTML-формой ещё до появления CORS — поэтому разрешения не спрашивают.</div>';
    }
    h+='</div>';

    if(pre){
      h+='<div class="code" style="margin:0 0 10px"><span class="code-label">1 · preflight</span>'
        +'<span class="fn">OPTIONS</span> /api/data HTTP/1.1\nHost: api.example.com\n<span class="op">Origin: https://app.example.com</span>\n'
        +'<span class="op">Access-Control-Request-Method: '+S.method+'</span>'
        +(S.extra?'\n<span class="op">Access-Control-Request-Headers: x-custom-token</span>':'')
        +'</div>';
      h+='<div class="code" style="margin:0 0 10px"><span class="code-label">2 · основной запрос (если разрешили)</span>'+req+'</div>';
    }else{
      h+='<div class="code" style="margin:0 0 10px"><span class="code-label">запрос уходит сразу</span>'+req+'</div>';
    }

    h+='<div style="padding:10px 12px;background:rgba(255,83,112,.07);border-left:2px solid #ff5370;border-radius:0 6px 6px 0;font-size:11.5px;color:#7d8ea3;line-height:1.7">'
      +'<span style="color:#ff5370">SEC ▸ </span>'
      +(pre
        ?'Preflight — не защита от CSRF, а следствие того, что такой запрос браузер раньше делать не умел. Атакующий просто использует «простой» вариант: форму с form-urlencoded.'
        :'Именно такие запросы и используются в CSRF: preflight не выполняется, cookies прикладываются автоматически. Ограничение Content-Type тремя типами — историческое: ровно это умела HTML-форма.')
      +'</div>';
    el.innerHTML=h;
  }
  window._corsM=function(m){if(METHODS.indexOf(m)<0)return;S.method=m;render();};
  window._corsC=function(c){if(!CTYPES.some(function(x){return x.id===c;}))return;S.ctype=c;render();};
  window._corsX=function(){S.extra=!S.extra;render();};
  render();
}

/* ===== LAB: m15 CSP builder ===== */
function buildCspLab(){
  mkToggleLab('cspLab','cs',[
    {id:'self',k:"default-src 'self'",c:'#38bdf8',on:true},
    {id:'inline',k:"'unsafe-inline'",c:'#ff5370',on:true},
    {id:'nonce',k:"'nonce-{RANDOM}'",c:'#00e676',on:false},
    {id:'dyn',k:"'strict-dynamic'",c:'#c792ea',on:false},
    {id:'obj',k:"object-src 'none'",c:'#ffb020',on:false},
    {id:'base',k:"base-uri 'none'",c:'#ffb020',on:false},
    {id:'fa',k:"frame-ancestors 'none'",c:'#5c9eff',on:false},
    {id:'conn',k:"connect-src 'self'",c:'#ff6ac1',on:false}
  ],function(st){
    let dirs=[];
    if(st.self)dirs.push("default-src 'self'");
    let script=[];
    if(st.nonce)script.push("'nonce-{RANDOM}'");
    if(st.dyn)script.push("'strict-dynamic'");
    if(st.self&&!st.dyn)script.push("'self'");
    if(st.inline)script.push("'unsafe-inline'");
    if(script.length)dirs.push('script-src '+script.join(' '));
    if(st.conn)dirs.push("connect-src 'self'");
    if(st.obj)dirs.push("object-src 'none'");
    if(st.base)dirs.push("base-uri 'none'");
    if(st.fa)dirs.push("frame-ancestors 'none'");
    const policy=dirs.length?dirs.join(';\n  '):'(политика пуста — CSP не задан)';

    const checks=[];
    const inlineBlocked=st.nonce||!st.inline;
    checks.push(['Inline-скрипты и обработчики onerror/onclick',
      inlineBlocked?1:0,
      inlineBlocked
        ?(st.nonce?'Есть nonce — браузер игнорирует unsafe-inline и пропускает только скрипты с верной меткой.':'unsafe-inline не задан — inline-код блокируется.')
        :'<b>unsafe-inline разрешает ровно то, чем эксплуатируется XSS.</b> Политика от XSS не защищает.']);
    checks.push(['Загрузка скрипта с чужого домена',
      (st.self||st.nonce||st.dyn)?1:0,
      (st.dyn?'strict-dynamic: доверие передаётся по цепочке от скрипта с валидным nonce, список доменов игнорируется.':(st.self||st.nonce)?'Разрешены только свои источники или помеченные nonce.':'Источники не ограничены.')]);
    checks.push(['Обход через <code class="ic">&lt;object data="javascript:..."&gt;</code>',
      st.obj?1:0,
      st.obj?"object-src 'none' закрывает этот вектор.":'<b>Не закрыто.</b> Устаревшие типы встраивания дают исполнение в обход script-src — поэтому object-src ставят в none почти всегда.']);
    checks.push(['Обход через инъекцию <code class="ic">&lt;base href&gt;</code>',
      st.base?1:0,
      st.base?"base-uri 'none' не даёт переписать базовый адрес.":'<b>Не закрыто.</b> Внедрённый тег base меняет базу для относительных ссылок — и скрипты начинают грузиться с домена атакующего, формально не нарушая script-src.']);
    checks.push(['Clickjacking (встраивание в чужой iframe)',
      st.fa?1:0,
      st.fa?"frame-ancestors 'none' запрещает встраивание. Это современная замена X-Frame-Options.":'Не закрыто. Нужен frame-ancestors или хотя бы X-Frame-Options.']);
    checks.push(['Эксфильтрация данных при сработавшем XSS',
      st.conn?1:0,
      st.conn?"connect-src 'self' не даёт отправить украденное на чужой домен через fetch или WebSocket. Каналы через img и навигацию остаются.":'Не ограничено: fetch на любой домен разрешён, украденные данные уйдут беспрепятственно.']);

    let h='<div class="code" style="margin:0 0 14px"><span class="code-label">Content-Security-Policy</span>'+policy+'</div>';
    const score=checks.filter(function(c){return c[1];}).length;
    const col=score>=5?'#00e676':(score>=3?'#ffb020':'#ff5370');
    h+='<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap">'
      +'<span style="font-size:11px;letter-spacing:1.5px;color:#4a5a6e">ОЦЕНКА ПОЛИТИКИ</span>'
      +'<span style="font-size:16px;font-weight:700;color:'+col+'">'+score+' / '+checks.length+'</span>'
      +'<span style="font-size:11px;color:#7d8ea3">'+(score>=5?'сильная политика':(score>=3?'частичная защита':'политика почти не защищает'))+'</span></div>';
    h+='<div style="display:flex;flex-direction:column;gap:6px">';
    checks.forEach(function(c){
      const ok=c[1],cc=ok?'#00e676':'#ff5370';
      h+='<div style="border:1px solid rgba(56,189,248,.14);border-left:3px solid '+cc+';border-radius:0 7px 7px 0;padding:9px 12px;background:#0c111a">'
        +'<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'
        +'<span style="font-size:12.5px;color:#cdd9e5">'+c[0]+'</span>'
        +'<span style="margin-left:auto;font-size:10px;letter-spacing:1px;color:'+cc+'">'+(ok?'закрыто':'ОТКРЫТО')+'</span></div>'
        +'<div style="font-size:11.5px;color:#7d8ea3;line-height:1.6;margin-top:4px">'+c[2]+'</div></div>';
    });
    h+='</div>';
    h+='<div style="margin-top:12px;padding:10px 12px;background:rgba(199,146,234,.07);border-left:2px solid #c792ea;border-radius:0 6px 6px 0;font-size:11.5px;color:#7d8ea3;line-height:1.7">'
      +'<span style="color:#c792ea">ЦЕЛЬ ▸ </span>включи <b>nonce + strict-dynamic + object-src none + base-uri none</b> и выключи unsafe-inline — получишь рекомендованную strict CSP. '
      +'Хвост вида <code class="ic">https: &#39;unsafe-inline&#39;</code> в реальных политиках оставляют осознанно: современный браузер их проигнорирует при наличии nonce и strict-dynamic, а старый откатится на рабочий вариант.</div>';
    return h;
  });
}

    {k:'X-XSS-Protection',c:'#ff5370',t:'Устаревший заголовок',
