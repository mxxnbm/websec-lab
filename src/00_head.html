<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Интерактивный курс по основам веба для AppSec-инженера: интернет, HTTP, браузер, состояние, архитектура и модель безопасности браузера.">
<title>Web Security Fundamentals :: AppSec Lab</title>
<style>
:root{
  --bg:#0a0e14;--bg2:#0d131c;--panel:#0f1620;--panel2:#0c111a;
  --cyan:#38bdf8;--cyan-dim:#0ea5c4;--green:#00e676;--amber:#ffb020;--red:#ff5370;--purple:#c792ea;--blue:#5c9eff;--pink:#ff6ac1;
  --txt:#cdd9e5;--txt-dim:#7d8ea3;--txt-faint:#4a5a6e;
  --border:rgba(56,189,248,.15);--border-b:rgba(56,189,248,.4);
  --glow:0 0 14px rgba(56,189,248,.35);
  --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono','Fira Code',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:14px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  background-image:linear-gradient(rgba(56,189,248,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(56,189,248,.03) 1px,transparent 1px);
  background-size:34px 34px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9999;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0,rgba(0,0,0,.14) 1px,transparent 1px,transparent 3px);opacity:.35;mix-blend-mode:multiply}
::selection{background:var(--cyan);color:#04121b}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--cyan-dim)}

/* ===== BOOT ===== */
#boot{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;cursor:pointer}
#boot .bootbox{width:min(600px,92vw)}
#boot .line{opacity:0;animation:bootln .18s forwards}
#boot .ok{color:var(--green)}#boot .cy{color:var(--cyan)}#boot .am{color:var(--amber)}#boot .dim{color:var(--txt-faint)}
@keyframes bootln{to{opacity:1}}
.enter-hint{margin-top:22px;color:var(--txt-faint);font-size:12px;opacity:0;animation:bootln .3s forwards;animation-delay:3.6s}
.enter-hint .k{color:var(--cyan);border:1px solid var(--border-b);border-radius:4px;padding:1px 7px}

/* ===== LAYOUT ===== */
#app{display:none;min-height:100vh}
.shell{display:flex;max-width:1240px;margin:0 auto;min-height:100vh}
aside{width:264px;flex-shrink:0;border-right:1px solid var(--border);padding:18px 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:0 18px 16px;border-bottom:1px solid var(--border);margin-bottom:12px}
.brand .logo{font-size:15px;font-weight:700;color:var(--cyan);letter-spacing:.5px;text-shadow:var(--glow)}
.brand .tag{font-size:10px;color:var(--txt-faint);letter-spacing:1.5px;margin-top:3px;text-transform:uppercase}
.progress-wrap{padding:0 18px;margin-bottom:14px}
.progress-bar{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden;border:1px solid var(--border)}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:width .5s}
.progress-txt{font-size:10px;color:var(--txt-faint);margin-top:5px}
.navsec{font-size:10px;color:var(--cyan-dim);letter-spacing:2px;padding:12px 18px 5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:9px;padding:7px 18px;cursor:pointer;font-size:12.5px;color:var(--txt-dim);border-left:2px solid transparent;transition:.14s}
.nav-item:hover{color:var(--txt);background:rgba(56,189,248,.05)}
.nav-item.active{color:var(--cyan);border-left-color:var(--cyan);background:rgba(56,189,248,.08)}
.nav-item .ico{width:18px;text-align:center;font-size:13px;flex-shrink:0}
.nav-item .chk{margin-left:auto;font-size:10px;color:var(--green);opacity:0;flex-shrink:0}
.nav-item.done .chk{opacity:1}
.nav-item:focus-visible,.btn:focus-visible,.qopt:focus-visible,.ref:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}

main{flex:1;padding:34px 40px;max-width:880px;min-width:0}
.burger{display:none;position:fixed;top:14px;left:14px;z-index:50;background:var(--panel);border:1px solid var(--border-b);color:var(--cyan);width:40px;height:40px;border-radius:8px;font-size:18px;cursor:pointer}

/* ===== CONTENT ===== */
.view{display:none;animation:fade .3s}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:10px;letter-spacing:2.5px;color:var(--cyan-dim);text-transform:uppercase;margin-bottom:11px}
.vtitle{font-size:30px;font-weight:700;letter-spacing:-.5px;line-height:1.12;margin-bottom:12px}
.vtitle .accent{color:var(--cyan);text-shadow:var(--glow)}
.vlede{font-size:14px;color:var(--txt-dim);line-height:1.7;margin-bottom:20px}
.sect{font-size:12px;letter-spacing:2px;color:var(--amber);text-transform:uppercase;margin:32px 0 14px;padding-bottom:7px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.sect::before{content:"\25B8";color:var(--cyan)}
.tx{color:var(--txt-dim);margin-bottom:14px;line-height:1.75}
.tx code,code.ic{font-size:12px;background:rgba(56,189,248,.1);color:var(--cyan);padding:1px 6px;border-radius:4px;word-break:break-word}
.hl{color:var(--txt);font-weight:600}
.cy{color:var(--cyan)}.gs{color:var(--green)}.am{color:var(--amber)}.rd{color:var(--red)}.pu{color:var(--purple)}.pk{color:var(--pink)}.bl{color:var(--blue)}.dm{color:var(--txt-faint)}

.card{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:15px 17px;margin:13px 0}
.card-t{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:7px}
.card.acc-c{border-left:3px solid var(--cyan)}.card.acc-g{border-left:3px solid var(--green)}
.card.acc-a{border-left:3px solid var(--amber)}.card.acc-r{border-left:3px solid var(--red)}
.card.acc-p{border-left:3px solid var(--purple)}.card.acc-b{border-left:3px solid var(--blue)}
.card .tx:last-child{margin-bottom:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
@media(max-width:680px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}

.code{background:#05090f;border:1px solid var(--border);border-radius:8px;padding:13px 15px;font-size:12.5px;line-height:1.7;overflow-x:auto;margin:14px 0;position:relative;white-space:pre-wrap;word-break:break-word}
.code-label{position:absolute;top:0;right:0;font-size:9px;color:var(--txt-faint);background:var(--bg2);padding:2px 8px;border-bottom-left-radius:6px;letter-spacing:1px}
.code .kw{color:var(--pink)}.code .op{color:var(--amber)}.code .st{color:var(--green)}.code .cmt{color:var(--txt-faint)}.code .fn{color:var(--cyan)}.code .nm{color:var(--purple)}

.lab{background:linear-gradient(180deg,rgba(56,189,248,.05),transparent);border:1px solid var(--border-b);border-radius:11px;overflow:hidden;margin:18px 0}
.lab-head{background:rgba(56,189,248,.08);padding:9px 15px;font-size:11px;color:var(--cyan);letter-spacing:1px;display:flex;align-items:center;gap:8px}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 1.5s infinite;flex-shrink:0}
@keyframes pulse{50%{opacity:.4}}
.lab-body{padding:16px}

.btn{background:transparent;border:1px solid var(--border-b);color:var(--cyan);font-family:var(--mono);font-size:12px;padding:8px 15px;cursor:pointer;letter-spacing:.4px;border-radius:6px;transition:.15s}
.btn:hover{background:var(--cyan);color:#04121b;box-shadow:var(--glow)}
.btn.sm{padding:5px 11px;font-size:11px}
.btn.gh{border-color:rgba(125,142,163,.4);color:var(--txt-dim)}
.btn.gh:hover{background:var(--txt-dim);color:#04121b;box-shadow:none}
.btn[disabled]{opacity:.35;cursor:not-allowed}
.btn[disabled]:hover{background:transparent;color:var(--cyan);box-shadow:none}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.t{width:100%;border-collapse:collapse;margin:13px 0;font-size:12.5px}
.t th{text-align:left;padding:8px 11px;background:var(--bg2);color:var(--cyan-dim);border:1px solid var(--border);font-weight:600}
.t td{padding:8px 11px;border:1px solid var(--border);color:var(--txt-dim);vertical-align:top}
.twrap{overflow-x:auto;margin:13px 0}
.twrap .t{margin:0;min-width:520px}

.ref{display:block;background:var(--panel2);border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:0 7px 7px 0;padding:10px 14px;margin:8px 0;text-decoration:none;transition:.15s}
.ref:hover{background:rgba(56,189,248,.06);border-left-color:var(--green)}
.ref .r-t{font-size:13px;color:var(--cyan);font-weight:600;display:block}
.ref .r-d{font-size:11px;color:var(--txt-faint);margin-top:2px;display:block}
.ref .r-u{font-size:10px;color:var(--txt-faint);margin-top:3px;word-break:break-all;display:block}
.ref.rfc{border-left-color:var(--purple)}.ref.rfc .r-t{color:var(--purple)}
.ref.owasp{border-left-color:var(--red)}.ref.owasp .r-t{color:var(--red)}
.ref.ps{border-left-color:var(--amber)}.ref.ps .r-t{color:var(--amber)}

.roadmap{display:flex;flex-direction:column;gap:3px;margin:16px 0}
.rm-stage{border:1px solid var(--border);border-radius:9px;padding:13px 15px;background:var(--panel);position:relative;transition:.2s;margin-top:9px}
.rm-stage:hover{border-color:var(--border-b)}
.rm-num{position:absolute;top:-8px;left:14px;font-size:9px;background:var(--bg);color:var(--cyan);padding:1px 8px;border:1px solid var(--border-b);border-radius:8px;letter-spacing:1px}
.rm-t{font-size:14px;font-weight:600;color:var(--txt);margin-bottom:5px}
.rm-tag{display:inline-block;font-size:9px;padding:2px 7px;border-radius:9px;margin-left:7px;background:rgba(56,189,248,.12);color:var(--cyan)}
.rm-tag.now{background:rgba(0,230,118,.14);color:var(--green)}
.rm-tag.next{background:rgba(255,176,32,.14);color:var(--amber)}
.rm-d{font-size:12px;color:var(--txt-dim)}

.hero-ascii{font-size:clamp(9px,1.6vw,12.5px);line-height:1.75;color:var(--cyan);white-space:pre;overflow-x:auto;margin-bottom:18px;padding:12px 16px;background:#05090f;border:1px solid var(--border);border-left:3px solid var(--cyan);border-radius:0 9px 9px 0}
.hero-ascii .gs{color:var(--green)}.hero-ascii .am{color:var(--amber)}.hero-ascii .dm{color:var(--txt-faint)}

/* ===== SCHEMES / SVG ===== */
.svgbox{background:#05090f;border:1px solid var(--border);border-radius:9px;padding:14px;margin:14px 0;overflow-x:auto}
.svgbox svg{display:block;margin:0 auto;max-width:100%;height:auto}
.svgcap{font-size:11px;color:var(--txt-faint);text-align:center;margin-top:9px;line-height:1.5}
.svgbox text{font-family:var(--mono)}
.ascii{background:#05090f;border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin:14px 0;overflow-x:auto;
  font-size:clamp(9px,2.1vw,12px);line-height:1.45;white-space:pre;color:var(--txt-dim)}
.ascii .h{color:var(--cyan)}.ascii .g{color:var(--green)}.ascii .a{color:var(--amber)}.ascii .r{color:var(--red)}.ascii .p{color:var(--purple)}.ascii .f{color:var(--txt-faint)}

/* ===== KEY-VALUE ===== */
.kv{margin:13px 0;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.kv-row{display:grid;grid-template-columns:190px 1fr;gap:0;border-bottom:1px solid var(--border)}
.kv-row:last-child{border-bottom:none}
.kv-k{padding:9px 13px;background:var(--panel2);color:var(--cyan);font-size:12px;border-right:1px solid var(--border);word-break:break-word}
.kv-v{padding:9px 13px;color:var(--txt-dim);font-size:12.5px}
@media(max-width:600px){.kv-row{grid-template-columns:1fr}.kv-k{border-right:none;border-bottom:1px solid var(--border)}}

/* ===== SEC BOX ===== */
.sec-box{background:linear-gradient(180deg,rgba(255,83,112,.07),transparent);border:1px solid rgba(255,83,112,.28);border-left:3px solid var(--red);border-radius:0 9px 9px 0;padding:13px 16px;margin:14px 0}
.sec-box .sb-t{font-size:11px;letter-spacing:1.6px;color:var(--red);text-transform:uppercase;margin-bottom:6px}
.sec-box .tx{margin-bottom:0}
.ask-box{background:linear-gradient(180deg,rgba(199,146,234,.07),transparent);border:1px solid rgba(199,146,234,.28);border-left:3px solid var(--purple);border-radius:0 9px 9px 0;padding:13px 16px;margin:14px 0}
.ask-box .sb-t{font-size:11px;letter-spacing:1.6px;color:var(--purple);text-transform:uppercase;margin-bottom:6px}
.ask-box .q{color:var(--txt);font-size:13px;margin-bottom:5px}
.ask-box .a{color:var(--txt-dim);font-size:12.5px;line-height:1.7}
.ask-box .q+.a{margin-bottom:11px}
.ask-box .a:last-child{margin-bottom:0}

/* ===== CHIPS ===== */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{font-size:10.5px;padding:3px 9px;border-radius:11px;background:rgba(56,189,248,.1);color:var(--cyan);border:1px solid var(--border)}
.chip.g{background:rgba(0,230,118,.1);color:var(--green);border-color:rgba(0,230,118,.25)}
.chip.a{background:rgba(255,176,32,.1);color:var(--amber);border-color:rgba(255,176,32,.25)}
.chip.r{background:rgba(255,83,112,.1);color:var(--red);border-color:rgba(255,83,112,.25)}
.chip.f{background:rgba(125,142,163,.1);color:var(--txt-faint);border-color:rgba(125,142,163,.2)}

/* ===== QUIZ ===== */
.quiz{border:1px solid rgba(199,146,234,.35);border-radius:11px;overflow:hidden;margin:22px 0;background:linear-gradient(180deg,rgba(199,146,234,.05),transparent)}
.quiz-head{background:rgba(199,146,234,.1);padding:9px 15px;font-size:11px;color:var(--purple);letter-spacing:1.2px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.quiz-head .qcount{margin-left:auto;color:var(--txt-faint);font-size:10px}
.quiz-head .qbest{font-size:10px;color:var(--green);border:1px solid rgba(0,230,118,.35);border-radius:9px;padding:1px 8px;letter-spacing:.5px}
.quiz-body{padding:16px}
.qq{font-size:13.5px;color:var(--txt);margin-bottom:12px;line-height:1.6}
.qopts{display:flex;flex-direction:column;gap:7px}
.qopt{text-align:left;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:10px 13px;cursor:pointer;
  color:var(--txt-dim);font-family:var(--mono);font-size:12.5px;line-height:1.55;transition:.14s;display:flex;gap:9px;align-items:flex-start}
.qopt:hover:not(.locked){border-color:var(--border-b);color:var(--txt)}
.qopt .mk{color:var(--txt-faint);flex-shrink:0}
.qopt.right{border-color:rgba(0,230,118,.55);background:rgba(0,230,118,.08);color:var(--txt)}
.qopt.right .mk{color:var(--green)}
.qopt.wrong{border-color:rgba(255,83,112,.55);background:rgba(255,83,112,.08);color:var(--txt)}
.qopt.wrong .mk{color:var(--red)}
.qopt.locked{cursor:default}
.qexp{margin-top:12px;padding:11px 13px;border-radius:7px;background:var(--panel2);border-left:3px solid var(--purple);font-size:12.5px;color:var(--txt-dim);line-height:1.7}
.qexp b{color:var(--txt)}
.qnav{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap}
.qdots{display:flex;gap:5px;margin-left:auto}
.qdot{width:8px;height:8px;border-radius:50%;background:var(--bg2);border:1px solid var(--border)}
.qdot.ok{background:var(--green);border-color:var(--green)}
.qdot.no{background:var(--red);border-color:var(--red)}
.qdot.cur{box-shadow:0 0 0 2px rgba(56,189,248,.4)}
.qscore{text-align:center;padding:14px}
.qscore .big{font-size:32px;font-weight:700;color:var(--cyan);text-shadow:var(--glow)}
.qscore .lb{font-size:12px;color:var(--txt-dim);margin-top:6px;line-height:1.7}

/* ===== FLASHCARDS ===== */
.fc-wrap{margin:16px 0}
.fc-filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.fc-filters .chip{cursor:pointer;user-select:none}
.fc-filters .chip.on{background:var(--cyan);color:#04121b;border-color:var(--cyan)}
.fc{border:1px solid var(--border-b);border-radius:12px;background:var(--panel);min-height:210px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:26px 22px;text-align:center;cursor:pointer;position:relative;transition:.18s}
.fc:hover{border-color:var(--cyan);box-shadow:0 0 18px rgba(56,189,248,.12)}
.fc .fc-side{font-size:9px;letter-spacing:2px;color:var(--txt-faint);position:absolute;top:11px;left:15px;text-transform:uppercase}
.fc .fc-tag{font-size:9px;letter-spacing:1.4px;color:var(--cyan-dim);position:absolute;top:11px;right:15px;text-transform:uppercase}
.fc .fc-q{font-size:17px;color:var(--txt);line-height:1.5;font-weight:600}
.fc .fc-a{font-size:13px;color:var(--txt-dim);line-height:1.75;text-align:left;width:100%}
.fc .fc-hint{font-size:10.5px;color:var(--txt-faint);margin-top:16px}
.fc-bar{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.fc-bar .cnt{margin-left:auto;font-size:11px;color:var(--txt-faint)}

/* ===== SEARCH ===== */
#searchOverlay{position:fixed;inset:0;background:rgba(4,8,14,.86);z-index:200;display:none;padding-top:12vh;backdrop-filter:blur(3px)}
#searchOverlay.on{display:block}
.sbox{width:min(620px,92vw);margin:0 auto;background:var(--panel);border:1px solid var(--border-b);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sbox input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);color:var(--txt);
  font-family:var(--mono);font-size:15px;padding:15px 18px;outline:none}
.sres{max-height:52vh;overflow-y:auto}
.sres-item{padding:10px 18px;cursor:pointer;border-bottom:1px solid var(--border);font-size:13px;color:var(--txt-dim)}
.sres-item:hover,.sres-item.sel{background:rgba(56,189,248,.09);color:var(--cyan)}
.sres-item .sm{font-size:10px;color:var(--txt-faint);display:block;margin-top:2px}
.sres-empty{padding:18px;color:var(--txt-faint);font-size:12px;text-align:center}
.shint{padding:8px 18px;font-size:10px;color:var(--txt-faint);border-top:1px solid var(--border);display:flex;gap:14px;flex-wrap:wrap}

@media(max-width:900px){
  aside{position:fixed;left:-274px;top:0;z-index:40;background:var(--bg);transition:left .25s;box-shadow:6px 0 24px rgba(0,0,0,.5)}
  aside.open{left:0}
  .burger{display:block}
  main{padding:64px 18px 40px}
  .kv-row{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ===== BOOT ===== -->
<div id="boot" onclick="enterApp()">
  <div class="bootbox" id="bootbox"></div>
  <div class="enter-hint">нажми <span class="k">ENTER</span> или тапни</div>
</div>

<!-- ===== SEARCH ===== -->
<div id="searchOverlay" onclick="if(event.target===this)closeSearch()">
  <div class="sbox">
    <input id="searchInput" type="text" placeholder="поиск по курсу..." autocomplete="off" aria-label="Поиск по курсу">
    <div class="sres" id="searchRes"></div>
    <div class="shint"><span><span class="cy">↑↓</span> навигация</span><span><span class="cy">Enter</span> открыть</span><span><span class="cy">Esc</span> закрыть</span></div>
  </div>
</div>

<!-- ===== APP ===== -->
<div id="app">
  <button class="burger" onclick="document.querySelector('aside').classList.toggle('open')" aria-label="Меню">☰</button>
  <div class="shell">
    <aside id="sidebar"></aside>
    <main id="mainViews"></main>
  </div>
</div>

<script>
